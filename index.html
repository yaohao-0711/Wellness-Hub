<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>心理小屋</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#a0845c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="心理小屋" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23a0845c'/%3E%3Ccircle cx='96' cy='78' r='28' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M96 106 L96 130' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M80 96 Q96 116 112 96' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cellipse cx='86' cy='74' rx='4' ry='5' fill='%23fff'/%3E%3Cellipse cx='106' cy='74' rx='4' ry='5' fill='%23fff'/%3E%3Crect x='80' y='136' width='32' height='4' rx='2' fill='%23fff' opacity='0.5'/%3E%3Crect x='74' y='144' width='44' height='4' rx='2' fill='%23fff' opacity='0.3'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #faf6f0;
      --surface: #fffcf7;
      --surface2: #f5efe6;
      --border: #e8ddd0;
      --accent: #a0845c;
      --accent2: #8fa67a;
      --accent3: #c4956a;
      --text: #3d3426;
      --text2: #8c7e6a;
      --text3: #b5a99a;
      --danger: #c0392b;
      --green: #8fa67a;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== VIEWS ===== */
    .view { display: none; min-height: 100vh; }
    .view.active { display: flex; flex-direction: column; }

    /* ===== TOP BAR ===== */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex; align-items: center; gap: 12px;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; }
    .topbar .back-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); font-size: 18px; transition: background .2s;
    }
    .topbar .back-btn:hover { background: var(--border); }
    .topbar .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 18px; transition: background .2s;
    }
    .topbar .icon-btn:hover { background: var(--border); }

    /* ===== SCROLL AREA ===== */
    .scroll-area {
      flex: 1; overflow-y: auto; padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ===== HOME VIEW ===== */
    .home-header {
      padding: 28px 16px 16px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .home-header .greeting { font-size: 22px; font-weight: 700; color: var(--accent); }
    .home-header .date-label { font-size: 13px; color: var(--text2); margin-top: 4px; }
    .add-task-btn {
      background: var(--accent);
      color: #fff; border: none; border-radius: 50%;
      width: 44px; height: 44px; font-size: 24px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(160,132,92,0.35);
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .add-task-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(160,132,92,0.5); }

    /* Task cards */
    .tasks-grid {
      padding: 0 16px 16px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
      position: relative; overflow: hidden;
    }
    .task-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent3); border-radius: 3px 0 0 3px;
    }
    .task-card:hover { transform: translateY(-2px); border-color: var(--accent3); box-shadow: 0 8px 24px rgba(160,132,92,.12); }
    .task-card .task-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .task-card .task-stats { font-size: 12px; color: var(--text2); }
    .task-card .task-total { font-size: 24px; font-weight: 700; color: var(--accent); }
    .task-card .task-total-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .task-card .today-dot {
      position: absolute; top: 12px; right: 12px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    }
    .task-card .delete-btn {
      position: absolute; bottom: 10px; right: 10px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(192,57,43,0.08); border: 1px solid var(--danger);
      color: var(--danger); font-size: 12px; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .task-card:hover .delete-btn { display: flex; }
    .task-card .delete-btn:hover { background: var(--danger); color: #fff; }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text3);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; line-height: 1.6; }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(61,52,38,.35); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 20px 20px 32px;
      width: 100%; max-width: 520px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-sheet h2 { font-size: 17px; margin-bottom: 16px; color: var(--accent); }

    /* ===== TASK TEMPLATE GRID ===== */
    .template-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    .template-card {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
      text-align: center;
    }
    .template-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--surface);
    }
    .template-card:active {
      transform: scale(0.97);
    }
    .template-card .tpl-icon {
      font-size: 24px; margin-bottom: 6px;
    }
    .template-card .tpl-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      margin-bottom: 3px;
    }
    .template-card .tpl-desc {
      font-size: 10px; color: var(--text3); line-height: 1.4;
    }
    .template-card.selected {
      border-color: var(--accent);
      background: rgba(160,132,92,0.08);
    }

    /* Custom task input */
    .custom-task-section {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .custom-task-section label {
      font-size: 12px; color: var(--text3); margin-bottom: 8px; display: block;
    }
    .input-field {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 15px; padding: 12px 14px;
      outline: none; transition: border-color .2s;
      font-family: inherit;
    }
    .input-field:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 12px; border-radius: var(--radius-sm);
      border: none; cursor: pointer; font-size: 15px; font-weight: 600;
      font-family: inherit; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text2); }

    /* ===== TASK DETAIL VIEW ===== */
    .records-list {
      display: flex; flex-direction: column-reverse;
      gap: 10px; padding-bottom: 16px;
    }
    .record-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
    }
    .record-item .record-time {
      font-size: 11px; color: var(--text3); margin-bottom: 8px;
    }
    .record-item .record-content { font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .record-item .record-images {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .record-item .record-img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--border);
    }
    .record-del {
      position: absolute; top: 10px; right: 10px;
      background: transparent; border: none; cursor: pointer;
      color: var(--text3); font-size: 14px; padding: 4px;
      transition: color .2s;
    }
    .record-del:hover { color: var(--danger); }

    /* Add record area */
    .add-record-area {
      position: sticky; bottom: 0; z-index: 10;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 16px 16px;
    }
    .add-record-textarea {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 15px; padding: 10px 12px;
      outline: none; resize: none; font-family: inherit;
      transition: border-color .2s; min-height: 72px; max-height: 180px;
    }
    .add-record-textarea:focus { border-color: var(--accent); }
    .add-record-controls {
      display: flex; align-items: center; gap: 10px; margin-top: 8px;
    }
    .img-upload-label {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; color: var(--accent); font-size: 18px;
      transition: background .2s;
    }
    .img-upload-label:hover { background: var(--border); }
    #img-input { display: none; }
    .img-previews {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
    }
    .img-preview-wrap {
      position: relative; width: 56px; height: 56px;
    }
    .img-preview-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: var(--radius-sm); border: 1px solid var(--border);
    }
    .img-preview-wrap .remove-img {
      position: absolute; top: -5px; right: -5px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--danger); color: #fff; border: none;
      cursor: pointer; font-size: 10px; display: flex;
      align-items: center; justify-content: center;
    }
    .submit-btn {
      margin-left: auto; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 8px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity .15s;
    }
    .submit-btn:hover { opacity: .85; }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ===== HEATMAP VIEW ===== */
    .heatmap-container { padding: 16px 16px 40px; }
    .heatmap-month-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .month-nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .month-nav-btn:hover { background: var(--border); }
    .month-label { font-size: 16px; font-weight: 600; }
    .heatmap-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .heatmap-dow {
      text-align: center; font-size: 11px; color: var(--text3);
      padding-bottom: 4px;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 5px;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--text3);
      position: relative; cursor: default;
      border: 1px solid transparent;
      transition: transform .1s;
    }
    .heatmap-cell.today { border-color: var(--accent); }
    .heatmap-cell.empty { background: transparent; }
    .heatmap-cell[data-level="1"] { background: rgba(160,132,92,0.15); color: var(--text2); }
    .heatmap-cell[data-level="2"] { background: rgba(160,132,92,0.30); color: var(--text); }
    .heatmap-cell[data-level="3"] { background: rgba(160,132,92,0.50); color: var(--text); }
    .heatmap-cell[data-level="4"] { background: rgba(160,132,92,0.75); color: #fff; font-weight: 700; }
    .heatmap-cell:hover { transform: scale(1.1); }
    .heatmap-legend {
      display: flex; align-items: center; gap: 6px;
      margin-top: 18px; font-size: 12px; color: var(--text3);
      justify-content: flex-end;
    }
    .legend-box {
      width: 14px; height: 14px; border-radius: 3px;
    }
    .heatmap-stats {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px; margin-top: 20px;
    }
    .heatmap-stats h3 { font-size: 14px; color: var(--text2); margin-bottom: 12px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-label { font-size: 13px; color: var(--text2); }
    .stat-value { font-size: 15px; font-weight: 700; color: var(--accent); }

    /* ===== IMAGE LIGHTBOX ===== */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.92); align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: var(--radius-sm); }
    .lightbox-close {
      position: absolute; top: 16px; right: 16px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: none; cursor: pointer;
      color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 20px; border-radius: 100px;
      font-size: 14px; z-index: 500; opacity: 0; pointer-events: none;
      transition: opacity .3s; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .toast.show { opacity: 1; }

    /* ===== SYNC BADGE ===== */
    .sync-badge {
      position: fixed; top: 60px; right: 12px; z-index: 150;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 100px; padding: 4px 10px;
      font-size: 11px; color: var(--text3);
      display: none; align-items: center; gap: 4px;
    }
    .sync-badge.active { display: flex; }
    .sync-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .sync-badge .dot.green { background: var(--green); }
    .sync-badge .dot.yellow { background: var(--accent3); }

    /* ===== WELCOME MODAL ===== */
    .welcome-backdrop {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(61,52,38,.3); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px 24px;
      max-width: 380px; width: 100%;
      text-align: center;
      animation: cardPop .35s cubic-bezier(.2,.9,.3,1.1);
      position: relative;
      box-shadow: 0 20px 60px rgba(160,132,92,.15);
    }
    @keyframes cardPop {
      from { opacity: 0; transform: scale(.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .welcome-card.hiding {
      animation: cardOut .3s ease forwards;
    }
    @keyframes cardOut {
      to { opacity: 0; transform: scale(.9) translateY(10px); }
    }
    .welcome-card .welcome-logo {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      background: var(--accent);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(160,132,92,.3);
    }
    .welcome-card .welcome-app-name {
      font-size: 14px; font-weight: 600;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 20px;
    }
    .welcome-card .welcome-quote {
      font-size: 16px; font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .welcome-card .welcome-sub {
      font-size: 11px; color: var(--text3);
      margin-bottom: 28px;
    }
    .welcome-card .mood-label {
      font-size: 12px; color: var(--text2);
      margin-bottom: 12px;
    }
    .mood-options {
      display: flex; gap: 8px; justify-content: center; flex-wrap: nowrap;
    }
    .mood-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
      color: var(--text2);
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .mood-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .mood-btn:active {
      transform: scale(0.95);
    }
    .welcome-skip {
      display: block; margin: 20px auto 0;
      font-size: 12px; color: var(--text3);
      text-align: center; cursor: pointer;
      border: none; background: none;
      font-family: inherit; padding: 4px 0;
      transition: color .2s;
    }
    .welcome-skip:hover {
      color: var(--text2);
    }

    /* ===== BOTTOM TAB BAR ===== */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: stretch;
      height: 56px; padding-bottom: env(safe-area-inset-bottom, 0);
      box-shadow: 0 -2px 12px rgba(160,132,92,0.06);
    }
    .tab-bar.hidden { display: none; }
    .tab-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; border: none;
      background: transparent; color: var(--text3);
      font-family: inherit; font-size: 10px; font-weight: 500;
      transition: color .2s;
      padding: 6px 0;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-item .tab-icon { font-size: 22px; line-height: 1; transition: transform .15s; }
    .tab-item.active { color: var(--accent); }
    .tab-item.active .tab-icon { transform: scale(1.1); }
    .tab-item:active .tab-icon { transform: scale(0.9); }

    /* Tab views */
    .tab-view { display: none; min-height: 100vh; padding-bottom: 72px; }
    .tab-view.active { display: flex; flex-direction: column; }

    /* Placeholder page center text */
    .placeholder-page {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text3); gap: 12px; padding: 40px 20px;
    }
    .placeholder-page .ph-icon { font-size: 56px; opacity: .6; }
    .placeholder-page .ph-text { font-size: 20px; font-weight: 600; letter-spacing: 2px; }
    .placeholder-page .ph-sub { font-size: 13px; color: var(--text3); }

    /* ===== MOOD TAB ===== */
    .mood-sun-page {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:40px 20px 80px; gap:20px;
    }
    .sun-btn {
      width:min(33vw,180px); height:min(33vw,180px);
      border-radius:50%;
      background:radial-gradient(circle at 38% 38%,#f5d89a,#d4a54a,#a0845c);
      display:flex; align-items:center; justify-content:center;
      font-size:min(15vw,80px); cursor:pointer;
      box-shadow:0 0 40px rgba(212,165,74,.4),0 0 80px rgba(212,165,74,.15);
      transition:transform .15s,box-shadow .15s;
      user-select:none; -webkit-tap-highlight-color:transparent;
      animation:sunPulse 3s ease-in-out infinite;
    }
    .sun-btn:active { transform:scale(.95); box-shadow:0 0 20px rgba(212,165,74,.3); animation:none; }
    .sun-btn.pressing { transform:scale(1.08); box-shadow:0 0 60px rgba(212,165,74,.6),0 0 120px rgba(212,165,74,.25); animation:none; }
    @keyframes sunPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }

    .sun-prompt { text-align:center; line-height:1.8; }
    .sun-prompt .prompt-line1 { font-size:16px; font-weight:600; color:var(--text2); letter-spacing:2px; }
    .sun-prompt .prompt-line2 { font-size:14px; color:var(--text3); letter-spacing:3px; }
    .sun-hint { font-size:12px; color:var(--text3); margin-top:8px; }

    /* Mood overlay (picker + reveal) */
    .mood-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(61,52,38,.45); backdrop-filter:blur(8px);
      display:none; align-items:center; justify-content:center;
      padding:24px;
    }
    .mood-overlay.open { display:flex; }

    /* Picker card */
    .picker-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:24px; padding:28px 20px 20px;
      max-width:360px; width:100%; text-align:center;
      animation:cardPop .35s cubic-bezier(.2,.9,.3,1.1);
    }
    .picker-round { font-size:12px; color:var(--text3); margin-bottom:16px; letter-spacing:1px; }
    .picker-emotions {
      display:flex; flex-wrap:wrap; gap:10px;

    }
    .emotion-chip {

    .emotion-chip.selected { background:var(--accent); color:#fff; border-color:var(--accent); transform:translateY(-2px); }
    .picker-nav { display:flex; align-items:center; justify-content:flex-end; margin-top:8px; }

      background:var(--accent); color:#fff; border:none; border-radius:100px;

    /* Reveal animation */

    .reveal-stars { position:relative; width:200px; height:200px; margin:0 auto 24px; }
    .reveal-orb {
      width:160px; height:160px; border-radius:50%;
      background:radial-gradient(circle,rgba(212,165,74,.5),rgba(160,132,92,.15),transparent);
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      animation:orbGlow 2s ease-in-out infinite;
    }
    @keyframes orbGlow {
      0%,100%{ opacity:.4; transform:translate(-50%,-50%) scale(1); }
      50%{ opacity:1; transform:translate(-50%,-50%) scale(1.2); }
    }
    .reveal-icon {
      font-size:64px; position:absolute; top:50%; left:50%;

    @keyframes revealBounce {
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.3); }
      60%{ opacity:1; transform:translate(-50%,-50%) scale(1.2); }
      100%{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  </style>
</head>

<script>
/* ======================== SUPABASE CONFIG ======================== */
const SUPABASE_URL = 'https://raorwfllxyydlolusisk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhb3J3ZmxseHZ5ZGxvbHVzaXNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzUyOTksImV4cCI6MjA5NTkxMTI5OX0.Y5uUyUZDhpROh8tVfETc5FxfsVZZloXqk_sGsiYM-cU';
const API = SUPABASE_URL + '/rest/v1';

const supabaseHeaders = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

/* ======================== DUAL STORAGE ======================== */
let storageMode = 'local';
let cloudAvailable = false;

const LS_KEY = 'checkin_app_data';

function loadLocalData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : { tasks: [] };
  } catch(e) {
    return { tasks: [] };
  }
}

function saveLocalData(data) {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
}

async function apiFetch(table, method, body, query) {
  let url = API + '/' + table;
  if (query) url += '?' + query;
  const opts = { method, headers: { ...supabaseHeaders } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('API error ' + res.status);
  if (res.status === 204) return null;
  return res.json();
}

async function testCloudConnection() {
  try {
    await apiFetch('tasks', 'GET', null, 'select=id&limit=1');
    return true;
  } catch(e) {
    return false;
  }
}

async function syncLocalToCloud() {
  const localData = loadLocalData();
  if (localData.tasks.length === 0) return;
  for (const task of localData.tasks) {
    try {
      const existing = await apiFetch('tasks', 'GET', null,
        'name=eq.' + encodeURIComponent(task.name));
      let cloudTask;
      if (existing && existing.length > 0) {
        cloudTask = existing[0];
      } else {
        const result = await apiFetch('tasks', 'POST', { name: task.name });
        cloudTask = Array.isArray(result) ? result[0] : result;
      }
      if (task.records && task.records.length > 0) {
        for (const rec of task.records) {
          try {
            await apiFetch('records', 'POST', {
              task_id: cloudTask.id,
              text: rec.text || '',
              images: rec.images || []
            });
          } catch(e) { /* skip duplicate */ }
        }
      }
    } catch(e) {
      console.error('Sync task error:', e);
    }
  }
}

let tasksCache = [];

async function loadData() {
  cloudAvailable = await testCloudConnection();
  if (cloudAvailable) {
    storageMode = 'cloud';
    try {
      const tasks = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,
          'task_id=eq.' + t.id + '&order=created_at.asc');
        t.records = records || [];
      }
      tasksCache = tasks;
      saveLocalData({ tasks: tasksCache.map(t => ({
        ...t,
        records: (t.records || []).map(r => ({ text: r.text, images: r.images, created_at: r.created_at }))
      }))});
      updateSyncBadge('cloud');
      return;
    } catch(e) {
      console.error('Cloud load failed, fallback to local:', e);
    }
  }
  storageMode = 'local';
  const localData = loadLocalData();
  tasksCache = localData.tasks || [];
  updateSyncBadge('local');
}

async function createTaskDB(name) {
  const localId = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const now = new Date().toISOString();
  const task = { id: localId, name, created_at: now, records: [] };
  if (cloudAvailable) {
    try {
      const result = await apiFetch('tasks', 'POST', { name });
      const cloudTask = Array.isArray(result) ? result[0] : result;
      task.id = cloudTask.id;
    } catch(e) {
      console.error('Cloud create task failed:', e);
    }
  }
  tasksCache.push(task);
  saveToLocal();
  return task;
}

async function deleteTaskDB(id) {
  if (cloudAvailable) {
    try {
      await apiFetch('records', 'DELETE', null, 'task_id=eq.' + id);
      await apiFetch('tasks', 'DELETE', null, 'id=eq.' + id);
    } catch(e) {
      console.error('Cloud delete task failed:', e);
    }
  }
  tasksCache = tasksCache.filter(t => t.id !== id);
  saveToLocal();
}

async function createRecordDB(taskId, text, images) {
  const localId = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const now = new Date().toISOString();
  const record = { id: localId, task_id: taskId, text: text || '', images: images || [], created_at: now };
  if (cloudAvailable) {
    try {
      const result = await apiFetch('records', 'POST', {
        task_id: taskId, text: text || '', images: images || []
      });
      const cloudRecord = Array.isArray(result) ? result[0] : result;
      record.id = cloudRecord.id;
    } catch(e) {
      console.error('Cloud create record failed:', e);
    }
  }
  const task = tasksCache.find(t => t.id === taskId);
  if (task) task.records.push(record);
  saveToLocal();
  return record;
}

async function deleteRecordDB(id) {
  if (cloudAvailable) {
    try {
      await apiFetch('records', 'DELETE', null, 'id=eq.' + id);
    } catch(e) {
      console.error('Cloud delete record failed:', e);
    }
  }
  for (const t of tasksCache) {
    t.records = t.records.filter(r => r.id !== id);
  }
  saveToLocal();
}

function saveToLocal() {
  saveLocalData({ tasks: tasksCache.map(t => ({
    id: t.id, name: t.name, created_at: t.created_at,
    records: (t.records || []).map(r => ({
      id: r.id, task_id: r.task_id, text: r.text,
      images: r.images, created_at: r.created_at
    }))
  }))});
}

function drawWheel() {
  const canvas = document.getElementById('wheel-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2, r = w/2 - 10;
  const n = 11;
  const segAngle = 2 * Math.PI / n;

  const colors = [
    '#7b7d8e','#87808a','#93837e','#9f8973','#a9916a',
    '#a0845c',
    '#8fa67a','#80b47a','#6ec48a','#5dd49e','#4de4b2'
  ];

  ctx.clearRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    const start = i * segAngle - Math.PI/2;
    const end = start + segAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const mid = start + segAngle / 2;
    const tr = r * 0.72;
    const tx = cx + tr * Math.cos(mid);
    const ty = cy + tr * Math.sin(mid);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i), tx, ty);
  }

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 38, 0, 2*Math.PI);
  ctx.fillStyle = '#faf6f0';
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,132,92,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function spinWheel() {
  if (wheelSpinning) return;
  wheelSpinning = true;
  const btn = document.getElementById('wheel-spin-btn');
  btn.disabled = true;
  const canvas = document.getElementById('wheel-canvas');

  const extraSpins = 5 + Math.floor(Math.random() * 5);
  const randomOffset = Math.random() * 360;
  const spinAmount = extraSpins * 360 + randomOffset;
  wheelRotation += spinAmount;

  canvas.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.6, 0.08, 1)';
  canvas.style.transform = `rotate(${wheelRotation}deg)`;

  function onEnd() {
    canvas.removeEventListener('transitionend', onEnd);
    wheelSpinning = false;
    const segAngle = 360 / 11;
    const eff = ((wheelRotation % 360) + 360) % 360;
    const result = Math.round(eff / segAngle) % 11;
    onWheelResult(result);
  }
  canvas.addEventListener('transitionend', onEnd);
}

function onWheelResult(num) {
  document.getElementById('wheel-result').textContent = num;
  const labels = ['冰点','很低','低','偏低','中等','还行','不错','挺好','很好','很棒','满格'];
  document.getElementById('wheel-result-label').textContent = `心情温度 ${num}/10 · ${labels[num]}`;
  document.getElementById('wheel-done-btn').style.display = '';

  // Save
  const now = new Date();
  const today = todayStr();
  const data = loadMoodData();
  if (!data[today]) data[today] = {};
  data[today].temp = num;
  data[today].tempTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  data[today].words = moodSession.selected;
  saveMoodData(data);
}

/* --- Me page: mood curve --- */
function renderMeCurve() {
  const data = loadMoodData();
  const days = [];
  for (let i = curveRange - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = formatDate(d);
    days.push({ date: d, key, temp: data[key]?.temp ?? null });
  }
  const container = document.getElementById('me-curve-chart');
  if (!container) return;
  const maxTemp = 10;
  container.innerHTML = days.map(d => {
    const h = d.temp !== null ? Math.max(6, (d.temp / maxTemp) * 72) : 4;
    const label = curveRange <= 7
      ? `${d.date.getMonth()+1}/${d.date.getDate()}`
      : (d.date.getDate() === 1 || (curveRange - days.indexOf(d) - 1) % 5 === 0
        ? `${d.date.getMonth()+1}/${d.getDate()}`
        : '');
    return `<div class="me-curve-bar ${d.temp !== null ? 'filled' : ''}" style="height:${h}px">
      ${d.temp !== null ? `<div class="me-curve-bar-value">${d.temp}</div>` : ''}
      ${label ? `<div class="me-curve-bar-label">${label}</div>` : ''}
    </div>`;
  }).join('');
}

/* ======================== UTILS ======================== */
function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDatetime(ts) {
  const d = new Date(ts);
  const date = formatDate(ts);
  const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `${date} ${time}`;
}

function todayStr() { return formatDate(Date.now()); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Hide tab bar when entering sub-views (detail, heatmap)
  const tabBar = document.getElementById('tab-bar');
  if (id === 'view-detail' || id === 'view-heatmap') {
    tabBar.classList.add('hidden');
  } else {
    tabBar.classList.remove('hidden');
  }
  window.scrollTo(0, 0);
}

function switchTab(tabName) {
  currentTab = tabName;
  // Hide all tab views
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  // Show selected tab
  document.getElementById('view-tab-' + tabName).classList.add('active');
  // Update tab bar
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tabName).classList.add('active');
  // Show tab bar
  document.getElementById('tab-bar').classList.remove('hidden');
  // Hide sub-views
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  window.scrollTo(0, 0);

  // Tab-specific init
  if (tabName === 'mood') {
    // Ensure sun page is visible, wheel hidden
    document.getElementById('mood-main').style.display = '';
    document.getElementById('mood-wheel-page').classList.remove('active');
  }
  if (tabName === 'me') {
    renderMeCurve();
  }
}

/* ======================== IMAGE COMPRESSION ======================== */
function compressImage(dataUrl, maxWidth, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

function renderHome() {
  const now = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('home-date').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 星期${weekdays[now.getDay()]}`;

  const grid = document.getElementById('tasks-grid');
  grid.innerHTML = '';

  if (tasksCache.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="emoji">🏠</div>
        <p>还没有练习<br>点右上角 <b>+</b> 添加第一个吧</p>
      </div>`;
    return;
  }

  const today = todayStr();
  tasksCache.forEach(task => {
    const total = (task.records || []).length;
    const todayCount = (task.records || []).filter(r => {
      const ts = r.created_at || r.ts;
      return formatDate(ts) === today;
    }).length;
    const card = document.createElement('div');
    card.className = 'task-card';
    card.innerHTML = `
      ${todayCount > 0 ? '<div class="today-dot" title="今日已打卡"></div>' : ''}
      <div class="task-name">${escapeHtml(task.name)}</div>
      <div class="task-total">${total}</div>
      <div class="task-total-label">总记录数</div>
      <div class="task-stats" style="margin-top:6px">今日 ${todayCount} 条</div>
      <button class="delete-btn" title="删除任务" onclick="event.stopPropagation();deleteTask('${task.id}')">✕</button>
    `;
    card.addEventListener('click', () => openTask(task.id));
    grid.appendChild(card);
  });
}

async function createTask() {
  const name = document.getElementById('new-task-name').value.trim();
  if (!name) { showToast('请选择或输入练习名称'); return; }
  // Check duplicate
  if (tasksCache.some(t => t.name === name)) {
    showToast('这个练习已经存在了');
    return;
  }
  try {
    await createTaskDB(name);
    closeNewTaskModal();
    renderHome();
    showToast('✅ 练习已创建');
  } catch (e) {
    showToast('❌ 创建失败');
    console.error(e);
  }
}

async function deleteTask(id) {
  if (!confirm('确定要删除这个练习及所有记录吗？')) return;
  try {
    await deleteTaskDB(id);
    renderHome();
    showToast('练习已删除');
  } catch (e) {
    showToast('❌ 删除失败');
    console.error(e);
  }
}

/* ======================== TASK DETAIL ======================== */
function openTask(id) {
  currentTaskId = id;
  pendingImages = [];
  const task = getTaskFromCache(id);
  if (!task) return;
  document.getElementById('detail-title').textContent = task.name;
  document.getElementById('record-text').value = '';
  document.getElementById('img-previews').innerHTML = '';
  renderRecords(task);
  setView('view-detail');
  setTimeout(() => {
    const sa = document.getElementById('detail-records');
    sa.scrollTop = sa.scrollHeight;
  }, 50);
}

function renderRecords(task) {
  const list = document.getElementById('records-list');
  list.innerHTML = '';

  const records = task.records || [];
  if (records.length === 0) {
    list.innerHTML = `<div style="text-align:center;color:var(--text3);padding:40px 0;font-size:14px;">还没有记录，快写下今天的第一条吧 ✍️</div>`;
    return;
  }

  const sorted = [...records].sort((a, b) => {
    const ta = new Date(a.created_at || a.ts).getTime();
    const tb = new Date(b.created_at || b.ts).getTime();
    return ta - tb;
  });

  sorted.forEach(r => {
    const ts = r.created_at || r.ts;
    const item = document.createElement('div');
    item.className = 'record-item';
    const imgs = (r.images || []).map(src =>
      `<img class="record-img" src="${src}" alt="" onclick="openLightbox(this.src)" />`
    ).join('');
    item.innerHTML = `
      <button class="record-del" onclick="deleteRecord('${r.id}')" title="删除">✕</button>
      <div class="record-time">${formatDatetime(ts)}</div>
      ${r.text ? `<div class="record-content">${escapeHtml(r.text)}</div>` : ''}
      ${imgs ? `<div class="record-images">${imgs}</div>` : ''}
    `;
    list.appendChild(item);
  });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function handleImages(input) {
  const files = Array.from(input.files);
  if (pendingImages.length + files.length > 9) {
    showToast('最多添加9张图片'); return;
  }
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      pendingImages.push(e.target.result);
      renderImagePreviews();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderImagePreviews() {
  const container = document.getElementById('img-previews');
  container.innerHTML = '';
  pendingImages.forEach((src, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'img-preview-wrap';
    wrap.innerHTML = `
      <img src="${src}" alt="" />
      <button class="remove-img" onclick="removePendingImg(${i})">✕</button>
    `;
    container.appendChild(wrap);
  });
}

function removePendingImg(i) {
  pendingImages.splice(i, 1);
  renderImagePreviews();
}

async function submitRecord() {
  const text = document.getElementById('record-text').value.trim();
  if (!text && pendingImages.length === 0) {
    showToast('请输入内容或添加图片');
    return;
  }
  try {
    const compressedImages = [];
    for (const img of pendingImages) {
      const compressed = await compressImage(img, 800, 0.7);
      compressedImages.push(compressed);
    }

    await createRecordDB(currentTaskId, text, compressedImages);
    document.getElementById('record-text').value = '';
    document.getElementById('record-text').style.height = 'auto';
    pendingImages = [];
    renderImagePreviews();

    const task = getTaskFromCache(currentTaskId);
    if (task) renderRecords(task);

    showToast('✅ 记录已保存');
    setTimeout(() => {
      const sa = document.getElementById('detail-records');
      sa.scrollTop = sa.scrollHeight;
    }, 50);
  } catch (e) {
    showToast('❌ 保存失败');
    console.error(e);
  }
}

async function deleteRecord(rid) {
  if (!confirm('删除这条记录？')) return;
  try {
    await deleteRecordDB(rid);
    const task = getTaskFromCache(currentTaskId);
    if (task) renderRecords(task);
    showToast('记录已删除');
  } catch (e) {
    showToast('❌ 删除失败');
    console.error(e);
  }
}

/* ======================== HEATMAP ======================== */
function goHeatmap() {
  heatmapYear = new Date().getFullYear();
  heatmapMonth = new Date().getMonth();
  const task = getTaskFromCache(currentTaskId);
  if (!task) return;
  document.getElementById('heatmap-title').textContent = task.name + ' · 热力图';
  renderHeatmap(task);
  setView('view-heatmap');
}

function changeMonth(delta) {
  heatmapMonth += delta;
  if (heatmapMonth < 0) { heatmapMonth = 11; heatmapYear--; }
  if (heatmapMonth > 11) { heatmapMonth = 0; heatmapYear++; }
  const task = getTaskFromCache(currentTaskId);
  if (task) renderHeatmap(task);
}

function renderHeatmap(task) {
  const y = heatmapYear, m = heatmapMonth;
  document.getElementById('heatmap-month-label').textContent = `${y}年${m+1}月`;

  const countMap = {};
  (task.records || []).forEach(r => {
    const d = new Date(r.created_at || r.ts);
    if (d.getFullYear() === y && d.getMonth() === m) {
      const key = String(d.getDate());
      countMap[key] = (countMap[key] || 0) + 1;
    }
  });

  const maxCount = Math.max(1, ...Object.values(countMap));

  function getLevel(count) {
    if (!count) return 0;
    const ratio = count / maxCount;
    if (ratio <= 0.25) return 1;
    if (ratio <= 0.5) return 2;
    if (ratio <= 0.75) return 3;
    return 4;
  }

  const grid = document.getElementById('heatmap-grid');
  grid.innerHTML = '';

  ['日','一','二','三','四','五','六'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'heatmap-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  const todayStr2 = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'heatmap-cell empty';
    grid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const count = countMap[String(day)] || 0;
    const level = getLevel(count);
    const el = document.createElement('div');
    el.className = 'heatmap-cell';
    if (level > 0) el.dataset.level = level;
    el.textContent = day;
    const isTodayCell = `${y}-${m}-${day}` === todayStr2;
    if (isTodayCell) el.classList.add('today');
    if (count > 0) el.title = `${y}年${m+1}月${day}日：${count} 条记录`;
    grid.appendChild(el);
  }

  const totalThisMonth = Object.values(countMap).reduce((a,b)=>a+b,0);
  const activeDays = Object.keys(countMap).length;
  const maxDay = Object.entries(countMap).sort((a,b)=>b[1]-a[1])[0];
  const totalAll = (task.records || []).length;

  document.getElementById('heatmap-stats').innerHTML = `
    <h3>📊 统计</h3>
    <div class="stat-row"><span class="stat-label">本月记录</span><span class="stat-value">${totalThisMonth} 条</span></div>
    <div class="stat-row"><span class="stat-label">本月打卡天数</span><span class="stat-value">${activeDays} 天</span></div>
    <div class="stat-row"><span class="stat-label">本月最多单日</span><span class="stat-value">${maxDay ? maxDay[1]+' 条 ('+maxDay[0]+'日)' : '—'}</span></div>
    <div class="stat-row"><span class="stat-label">全部记录</span><span class="stat-value">${totalAll} 条</span></div>
  `;
}

/* ======================== NAVIGATION ======================== */
async function goHome() {
  if (cloudAvailable) {
    try {
      const tasks = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,
          'task_id=eq.' + t.id + '&order=created_at.asc');
        t.records = records || [];
      }
      tasksCache = tasks;
      saveToLocal();
    } catch(e) { /* keep current cache */ }
  }
  renderHome();
  switchTab('record');
}

function goDetail() {
  const task = getTaskFromCache(currentTaskId);
  if (task) renderRecords(task);
  setView('view-detail');
}

/* ======================== LIGHTBOX ======================== */
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

/* ======================== ESCAPE HTML ======================== */
function escapeHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ======================== KEYBOARD ======================== */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') {
    const active = document.querySelector('.view.active');
    if (active && active.id === 'view-detail') submitRecord();
  }
  if (e.key === 'Escape') {
    closeLightbox();
    closeNewTaskModal();
  }
});

/* ======================== INIT ======================== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => {
    console.log('Service Worker registered');
  }).catch(err => {
    console.log('SW registration failed:', err);
  });
}

(async function init() {
  // Show welcome modal every time with rotating quote
  document.getElementById('welcome-quote').textContent = getNextQuote();
  document.getElementById('welcome-overlay').style.display = 'flex';

  // Init mood sun button
  initSunButton();

  // First load local data immediately (no loading screen!)
  const localData = loadLocalData();
  tasksCache = localData.tasks || [];
  renderHome();
  updateSyncBadge('local');

  // Then try cloud in background
  try {
    cloudAvailable = await testCloudConnection();
    if (cloudAvailable) {
      const tasks = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,
          'task_id=eq.' + t.id + '&order=created_at.asc');
        t.records = records || [];
      }
      tasksCache = tasks;
      saveToLocal();
      renderHome();
      updateSyncBadge('cloud');

      if (localData.tasks && localData.tasks.length > 0 && tasks.length === 0) {
        await syncLocalToCloud();
        const reloaded = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
        for (const t of reloaded) {
          const recs = await apiFetch('records', 'GET', null,
            'task_id=eq.' + t.id + '&order=created_at.asc');
          t.records = recs || [];
        }
        tasksCache = reloaded;
        saveToLocal();
        renderHome();
      }
    }
  } catch(e) {
    console.log('Cloud unavailable, using local only');
  }
})();
</script>
