<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>心理小屋</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#a0845c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="心理小屋" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23a0845c'/%3E%3Ccircle cx='96' cy='78' r='28' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M96 106 L96 130' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M80 96 Q96 116 112 96' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cellipse cx='86' cy='74' rx='4' ry='5' fill='%23fff'/%3E%3Cellipse cx='106' cy='74' rx='4' ry='5' fill='%23fff'/%3E%3Crect x='80' y='136' width='32' height='4' rx='2' fill='%23fff' opacity='0.5'/%3E%3Crect x='74' y='144' width='44' height='4' rx='2' fill='%23fff' opacity='0.3'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f8f4ee;
      --surface: #fffdf9;
      --surface2: #f3ede4;
      --border: #e5d9cc;
      --accent: #9a7d54;
      --accent2: #8fa67a;
      --accent3: #c4956a;
      --accent-light: rgba(154,125,84,0.08);
      --text: #3a3125;
      --text2: #8a7c68;
      --text3: #b8a998;
      --danger: #c0392b;
      --green: #8fa67a;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow-sm: 0 2px 8px rgba(154,125,84,0.06);
      --shadow-md: 0 4px 16px rgba(154,125,84,0.10);
      --shadow-lg: 0 8px 32px rgba(154,125,84,0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== VIEWS ===== */
    .view { display: none; min-height: 100vh; }
    .view.active { display: flex; flex-direction: column; }

    /* ===== TOP BAR ===== */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(248,244,238,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex; align-items: center; gap: 12px;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; }
    .topbar .back-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); font-size: 18px; transition: background .2s;
    }
    .topbar .back-btn:hover { background: var(--border); }
    .topbar .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 18px; transition: background .2s;
    }
    .topbar .icon-btn:hover { background: var(--border); }

    /* ===== SCROLL AREA ===== */
    .scroll-area {
      flex: 1; overflow-y: auto; padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ===== HOME VIEW ===== */
    .home-header {
      padding: 28px 16px 16px;
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }
    .home-header .greeting {
      font-size: 22px; font-weight: 700; color: var(--accent);
      text-align: center; width: 100%;
      letter-spacing: 2px;
    }
    .home-header .date-label {
      font-size: 13px; color: var(--text2); margin-top: 4px;
      text-align: center; width: 100%;
    }
    .home-header-text { text-align: center; flex: 1; }
    .home-header .add-task-btn {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    }
    .add-task-btn {
      background: linear-gradient(135deg, var(--accent3), var(--accent));
      color: #fff; border: none; border-radius: 50%;
      width: 44px; height: 44px; font-size: 24px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(154,125,84,0.35);
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .add-task-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(154,125,84,0.5); }

    /* Task cards */
    .tasks-grid {
      padding: 0 16px 16px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      position: relative; overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .task-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 4px; border-radius: 4px 0 0 4px;
    }
    .task-card:hover { transform: translateY(-3px); border-color: var(--accent3); box-shadow: var(--shadow-lg); }
    .task-card .edit-hint {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.65); color: #fff; font-size: 11px;
      padding: 3px 10px; border-radius: 100px; opacity: 0;
      transition: opacity .2s; pointer-events: none; z-index: 2;
    }
    .task-card.long-pressing .edit-hint { opacity: 1; }
    .task-card .task-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .task-card .task-stats { font-size: 12px; color: var(--text2); }
    .task-card .task-total { font-size: 24px; font-weight: 700; color: var(--accent); }
    .task-card .task-total-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .task-card .today-dot {
      position: absolute; top: 12px; right: 12px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    }
    .task-card .delete-btn {
      position: absolute; bottom: 10px; right: 10px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(192,57,43,0.08); border: 1px solid var(--danger);
      color: var(--danger); font-size: 12px; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .task-card:hover .delete-btn { display: flex; }
    .task-card .delete-btn:hover { background: var(--danger); color: #fff; }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text3);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; line-height: 1.6; }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(61,52,38,.35); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 20px 20px 32px;
      width: 100%; max-width: 520px;
      animation: slideUp .25s ease;
      box-shadow: 0 -4px 24px rgba(154,125,84,0.12);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-sheet h2 { font-size: 17px; margin-bottom: 16px; color: var(--accent); }

    /* ===== TASK TEMPLATE GRID ===== */
    .template-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    .template-card {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      cursor: pointer;
      transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
      text-align: center;
    }
    .template-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }
    .template-card:active {
      transform: scale(0.97);
    }
    .template-card .tpl-icon {
      font-size: 24px; margin-bottom: 6px;
    }
    .template-card .tpl-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      margin-bottom: 3px;
    }
    .template-card .tpl-desc {
      font-size: 10px; color: var(--text3); line-height: 1.4;
    }
    .template-card.selected {
      border-color: var(--accent);
      background: rgba(160,132,92,0.08);
    }

    /* Custom task input */
    .custom-task-section {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .custom-task-section label {
      font-size: 12px; color: var(--text3); margin-bottom: 8px; display: block;
    }
    .input-field {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 15px; padding: 12px 14px;
      outline: none; transition: border-color .2s;
      font-family: inherit;
    }
    .input-field:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 12px; border-radius: var(--radius-sm);
      border: none; cursor: pointer; font-size: 15px; font-weight: 600;
      font-family: inherit; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: linear-gradient(135deg, var(--accent3), var(--accent)); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text2); }

    /* ===== TASK DETAIL VIEW ===== */
    .records-list {
      display: flex; flex-direction: column-reverse;
      gap: 10px; padding-bottom: 16px;
    }
    .record-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .record-item .record-time {
      font-size: 11px; color: var(--text3); margin-bottom: 8px;
    }
    .record-item .record-content { font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .record-item .record-images {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .record-item .record-img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--border);
    }
    .record-del {
      position: absolute; top: 10px; right: 10px;
      background: transparent; border: none; cursor: pointer;
      color: var(--text3); font-size: 14px; padding: 4px;
      transition: color .2s;
    }
    .record-del:hover { color: var(--danger); }

    /* Add record area */
    .add-record-area {
      position: sticky; bottom: 0; z-index: 10;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 16px 16px;
    }
    .add-record-textarea {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 15px; padding: 10px 12px;
      outline: none; resize: none; font-family: inherit;
      transition: border-color .2s; min-height: 72px; max-height: 180px;
    }
    .add-record-textarea:focus { border-color: var(--accent); }
    .add-record-controls {
      display: flex; align-items: center; gap: 10px; margin-top: 8px;
    }
    .img-upload-label {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; color: var(--accent); font-size: 18px;
      transition: background .2s;
    }
    .img-upload-label:hover { background: var(--border); }
    #img-input { display: none; }
    .img-previews {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
    }
    .img-preview-wrap {
      position: relative; width: 56px; height: 56px;
    }
    .img-preview-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: var(--radius-sm); border: 1px solid var(--border);
    }
    .img-preview-wrap .remove-img {
      position: absolute; top: -5px; right: -5px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--danger); color: #fff; border: none;
      cursor: pointer; font-size: 10px; display: flex;
      align-items: center; justify-content: center;
    }
    .submit-btn {
      margin-left: auto; background: linear-gradient(135deg, var(--accent3), var(--accent)); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 8px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity .15s, transform .15s;
    }
    .submit-btn:hover { opacity: .85; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ===== HEATMAP VIEW ===== */
    .heatmap-container { padding: 16px 16px 40px; }
    .heatmap-month-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .month-nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .month-nav-btn:hover { background: var(--border); }
    .month-label { font-size: 16px; font-weight: 600; }
    .heatmap-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .heatmap-dow {
      text-align: center; font-size: 11px; color: var(--text3);
      padding-bottom: 4px;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 5px;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--text3);
      position: relative; cursor: default;
      border: 1px solid transparent;
      transition: transform .1s;
    }
    .heatmap-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .heatmap-cell.empty { background: transparent; }
    .heatmap-cell[data-level="1"] { background: rgba(154,125,84,0.18); color: var(--text2); }
    .heatmap-cell[data-level="2"] { background: rgba(154,125,84,0.55); color: #fff; font-weight: 600; }
    .heatmap-cell:hover { transform: scale(1.1); }
    .heatmap-legend {
      display: flex; align-items: center; gap: 6px;
      margin-top: 18px; font-size: 12px; color: var(--text3);
      justify-content: flex-end;
    }
    .legend-box {
      width: 14px; height: 14px; border-radius: 3px;
    }
    .heatmap-stats {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px; margin-top: 20px;
      box-shadow: var(--shadow-sm);
    }
    .heatmap-stats h3 { font-size: 14px; color: var(--text2); margin-bottom: 12px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-label { font-size: 13px; color: var(--text2); }
    .stat-value { font-size: 15px; font-weight: 700; color: var(--accent); }

    /* ===== ANNIVERSARY SECTION ===== */
    .anni-section {
      margin-top: 24px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .2s, border-color .2s, box-shadow .2s;
      box-shadow: var(--shadow-sm);
    }
    .anni-section:hover {
      border-color: var(--accent3);
      background: rgba(154,125,84,0.04);
      box-shadow: var(--shadow-md);
    }
    .anni-section-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .anni-section-title {
      font-size: 15px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 6px;
    }
    .anni-section-count {
      font-size: 12px; color: var(--text3);
      background: var(--surface2); padding: 2px 8px;
      border-radius: 100px;
    }
    .anni-section-hint {
      font-size: 12px; color: var(--text3); margin-top: 6px;
    }
    .anni-preview-list {
      margin-top: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .anni-preview-item {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; padding: 6px 8px;
      background: rgba(160,132,92,0.04); border-radius: 6px;
    }
    .anni-preview-name { color: var(--text2); }
    .anni-preview-days {
      font-size: 13px; font-weight: 700; color: var(--accent);
    }

    /* ===== ANNIVERSARY DETAIL PAGE ===== */
    .anni-detail-page { padding: 16px 16px 80px; }
    .anni-list { display: flex; flex-direction: column; gap: 10px; }
    .anni-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: relative; box-shadow: var(--shadow-sm);
      cursor: pointer; transition: transform .15s, box-shadow .15s;
    }
    .anni-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .anni-card-info { flex: 1; }
    .anni-card-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .anni-card-date { font-size: 12px; color: var(--text3); }
    .anni-card-days {
      text-align: right;
      min-width: 70px;
    }
    .anni-card-num {
      font-size: 22px; font-weight: 700; color: var(--accent);
      line-height: 1;
    }
    .anni-card-label {
      font-size: 11px; color: var(--text3); margin-top: 2px;
    }
    .anni-card-delete {
      display: none;
      position: absolute; top: 4px; right: 4px;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--surface2); border: none;
      color: var(--text3); font-size: 12px; cursor: pointer;
      align-items: center; justify-content: center;
    }
    .anni-card:hover .anni-card-delete { display: flex; }
    .anni-card-delete:hover { background: var(--danger); color: #fff; }
    .anni-empty {
      text-align: center; padding: 40px 20px;
      color: var(--text3); font-size: 14px;
    }
    .anni-empty-icon { font-size: 36px; margin-bottom: 8px; }

    /* ===== ANNIVERSARY SINGLE DETAIL ===== */
    .anni-single-page {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; padding: 40px 24px;
      text-align: center;
      background-size: cover; background-position: center;
      position: relative;
    }
    .anni-single-page.has-bg .anni-single-name,
    .anni-single-page.has-bg .anni-single-suffix,
    .anni-single-page.has-bg .anni-single-unit,
    .anni-single-page.has-bg .anni-single-date {
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
    .anni-single-page.has-bg .anni-single-num {
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,.4);
    }
    .anni-single-page.has-bg .anni-single-date {
      background: rgba(0,0,0,.25);
      border-color: rgba(255,255,255,.2);
      backdrop-filter: blur(4px);
    }
    .anni-single-name {
      font-size: 18px; font-weight: 600; color: var(--text);
      margin-bottom: 4px;
    }
    .anni-single-suffix {
      font-size: 15px; color: var(--text2); margin-bottom: 24px;
    }
    .anni-single-num {
      font-size: 72px; font-weight: 800; color: var(--accent);
      line-height: 1; margin-bottom: 8px;
      text-shadow: 0 2px 20px rgba(154,125,84,0.15);
    }
    .anni-single-unit {
      font-size: 20px; font-weight: 600; color: var(--accent);
      margin-bottom: 36px; opacity: 0.8;
    }
    .anni-single-date {
      font-size: 14px; color: var(--text3);
      padding: 8px 20px; border-radius: 100px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .anni-bg-picker-btn {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.25);
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: background .2s;
    }
    .anni-bg-picker-btn:hover { background: rgba(0,0,0,.5); }

    /* ===== ANNIVERSARY MODAL ===== */
    .anni-form-row { margin-bottom: 14px; }
    .anni-form-row label {
      display: block; font-size: 13px; color: var(--text2);
      margin-bottom: 6px; font-weight: 500;
    }
    .anni-form-row input[type="date"] {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
      font-family: inherit; font-size: 14px;
    }

    /* ===== IMAGE LIGHTBOX ===== */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.92); align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: var(--radius-sm); }
    .lightbox-close {
      position: absolute; top: 16px; right: 16px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: none; cursor: pointer;
      color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 20px; border-radius: 100px;
      font-size: 14px; z-index: 500; opacity: 0; pointer-events: none;
      transition: opacity .3s; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .toast.show { opacity: 1; }

    /* ===== SYNC BADGE ===== */
    .sync-badge {
      position: fixed; top: 60px; right: 12px; z-index: 150;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 100px; padding: 4px 10px;
      font-size: 11px; color: var(--text3);
      display: none; align-items: center; gap: 4px;
    }
    .sync-badge.active { display: flex; }
    .sync-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .sync-badge .dot.green { background: var(--green); }
    .sync-badge .dot.yellow { background: var(--accent3); }

    /* ===== WELCOME MODAL ===== */
    .welcome-backdrop {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(61,52,38,.3); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px 24px;
      max-width: 380px; width: 100%;
      text-align: center;
      animation: cardPop .35s cubic-bezier(.2,.9,.3,1.1);
      position: relative;
      box-shadow: 0 20px 60px rgba(160,132,92,.15);
    }
    @keyframes cardPop {
      from { opacity: 0; transform: scale(.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .welcome-card.hiding {
      animation: cardOut .3s ease forwards;
    }
    @keyframes cardOut {
      to { opacity: 0; transform: scale(.9) translateY(10px); }
    }
    .welcome-card .welcome-logo {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      background: var(--accent);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(160,132,92,.3);
    }
    .welcome-card .welcome-app-name {
      font-size: 14px; font-weight: 600;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 20px;
    }
    .welcome-card .welcome-quote {
      font-size: 16px; font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .welcome-card .welcome-sub {
      font-size: 11px; color: var(--text3);
      margin-bottom: 28px;
    }
    .welcome-card .mood-label {
      font-size: 12px; color: var(--text2);
      margin-bottom: 12px;
    }
    .mood-options {
      display: flex; gap: 8px; justify-content: center; flex-wrap: nowrap;
    }
    .mood-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
      color: var(--text2);
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .mood-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .mood-btn:active {
      transform: scale(0.95);
    }
    .welcome-skip {
      display: block; margin: 20px auto 0;
      font-size: 12px; color: var(--text3);
      text-align: center; cursor: pointer;
      border: none; background: none;
      font-family: inherit; padding: 4px 0;
      transition: color .2s;
    }
    .welcome-skip:hover {
      color: var(--text2);
    }

    /* ===== BOTTOM TAB BAR ===== */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,253,249,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; align-items: stretch;
      height: 56px; padding-bottom: env(safe-area-inset-bottom, 0);
      box-shadow: 0 -2px 12px rgba(154,125,84,0.06);
    }
    .tab-bar.hidden { display: none; }
    .tab-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; border: none;
      background: transparent; color: var(--text3);
      font-family: inherit; font-size: 10px; font-weight: 500;
      transition: color .2s;
      padding: 6px 0;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-item .tab-icon { font-size: 22px; line-height: 1; transition: transform .15s; }
    .tab-item.active { color: var(--accent); }
    .tab-item.active .tab-icon { transform: scale(1.1); }
    .tab-item:active .tab-icon { transform: scale(0.9); }

    /* Tab views */
    .tab-view { display: none; min-height: 100vh; padding-bottom: 72px; }
    .tab-view.active { display: flex; flex-direction: column; }

    /* Placeholder page center text */
    .placeholder-page {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text3); gap: 12px; padding: 40px 20px;
    }
    .placeholder-page .ph-icon { font-size: 56px; opacity: .6; }
    .placeholder-page .ph-text { font-size: 20px; font-weight: 600; letter-spacing: 2px; }
    .placeholder-page .ph-sub { font-size: 13px; color: var(--text3); }

    /* ===== MOOD TAB ===== */
    .mood-sun-page {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:40px 20px 80px; gap:20px;
    }
    .sun-btn {
      width:min(33vw,180px); height:min(33vw,180px);
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#f7dfa0,#d9b35e,#9a7d54);
      display:flex; align-items:center; justify-content:center;
      font-size:min(15vw,80px); cursor:pointer;
      box-shadow:0 0 50px rgba(217,179,94,.35),0 0 100px rgba(217,179,94,.10);
      transition:transform .15s,box-shadow .15s;
      user-select:none; -webkit-tap-highlight-color:transparent;
      animation:sunPulse 3s ease-in-out infinite;
    }
    .sun-btn:active { transform:scale(.95); box-shadow:0 0 20px rgba(212,165,74,.3); animation:none; }
    .sun-btn.pressing { transform:scale(1.08); box-shadow:0 0 60px rgba(212,165,74,.6),0 0 120px rgba(212,165,74,.25); animation:none; }
    @keyframes sunPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }

    .sun-prompt { text-align:center; line-height:1.8; }
    .sun-prompt .prompt-line1 { font-size:16px; font-weight:600; color:var(--text2); letter-spacing:2px; }
    .sun-prompt .prompt-line2 { font-size:14px; color:var(--text3); letter-spacing:3px; }
    .sun-hint { font-size:12px; color:var(--text3); margin-top:8px; }

    /* Mood overlay (picker + reveal) */
    .mood-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(61,52,38,.45); backdrop-filter:blur(8px);
      display:none; align-items:center; justify-content:center;
      padding:24px;
    }
    .mood-overlay.open { display:flex; }

    /* Picker card */
    .picker-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:24px; padding:28px 20px 20px;
      max-width:360px; width:100%; text-align:center;
      animation:cardPop .35s cubic-bezier(.2,.9,.3,1.1);
    }
    .picker-round { font-size:12px; color:var(--text3); margin-bottom:16px; letter-spacing:1px; }
    .picker-emotions {
      display:flex; flex-wrap:wrap; gap:10px;
      justify-content:center; margin-bottom:20px;
    }
    .emotion-chip {
      background:var(--surface2); border:1.5px solid var(--border);
      border-radius:100px; padding:8px 20px; cursor:pointer;
      transition:transform .15s,border-color .15s,background .15s;
      color:var(--text2); font-family:inherit;
      font-size:14px; font-weight:500; letter-spacing:1px;
      user-select:none; -webkit-tap-highlight-color:transparent;
    }
    .emotion-chip:hover { transform:translateY(-2px); border-color:var(--accent); }
    .emotion-chip:active { transform:scale(.95); }
    .emotion-chip.selected { background:var(--accent); color:#fff; border-color:var(--accent); transform:translateY(-2px); box-shadow: 0 3px 10px rgba(154,125,84,0.3); }
    .picker-nav { display:flex; align-items:center; justify-content:flex-end; margin-top:8px; }
    .picker-nav-btn {
      background: linear-gradient(135deg, var(--accent3), var(--accent)); color: #fff; border:none; border-radius:100px;
      padding:10px 24px; font-size:14px; font-weight:600; cursor:pointer;
      font-family:inherit; transition:opacity .15s,transform .15s;
      display:flex; align-items:center; gap:6px;
    }
    .picker-nav-btn:hover { opacity:.85; }
    .picker-nav-btn:active { transform:scale(.95); }

    /* Reveal animation */
    .reveal-container { text-align:center; animation:cardPop .5s cubic-bezier(.2,.9,.3,1.1); }
    .reveal-stars { position:relative; width:200px; height:200px; margin:0 auto 24px; }
    .reveal-orb {
      width:160px; height:160px; border-radius:50%;
      background:radial-gradient(circle,rgba(212,165,74,.5),rgba(160,132,92,.15),transparent);
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      animation:orbGlow 2s ease-in-out infinite;
    }
    @keyframes orbGlow {
      0%,100%{ opacity:.4; transform:translate(-50%,-50%) scale(1); }
      50%{ opacity:1; transform:translate(-50%,-50%) scale(1.2); }
    }
    .reveal-icon {
      font-size:64px; position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      animation:revealBounce .8s cubic-bezier(.2,.9,.3,1.1) forwards;
      opacity:0;
    }
    @keyframes revealBounce {
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.3); }
      60%{ opacity:1; transform:translate(-50%,-50%) scale(1.2); }
      100%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    }
    .star-particle {
      position:absolute; font-size:14px;
      animation:starFloat 1.5s ease-out forwards; opacity:0;
    }
    @keyframes starFloat {
      0%{ opacity:1; transform:translate(0,0) scale(1); }
      100%{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(0); }
    }

    /* Advice card */
    .advice-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:20px; padding:24px 20px 20px;
      max-width:360px; width:100%; text-align:center;
      animation:cardPop .5s cubic-bezier(.2,.9,.3,1.1) .2s both;
      box-shadow: var(--shadow-lg);
    }
    .advice-mood-tags { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:16px; }
    .advice-mood-tag {
      background:rgba(154,125,84,.1); border-radius:100px;
      padding:4px 12px; font-size:12px; color:var(--accent);
    }
    .advice-title { font-size:18px; font-weight:700; color:var(--text); margin-bottom:12px; line-height:1.4; }
    .advice-text { font-size:14px; color:var(--text2); line-height:1.8; margin-bottom:8px; text-align:left; }
    .advice-strategy {
      font-size:13px; color:var(--accent); line-height:1.7; text-align:left;
      background:rgba(154,125,84,.06); border-radius:var(--radius-sm);
      padding:12px 14px; margin-top:12px;
    }
    .advice-nav { display:flex; justify-content:flex-end; margin-top:16px; }

    /* Wheel page */
    .mood-wheel-page {
      flex:1; display:none; flex-direction:column;
      align-items:center; justify-content:center;
      padding:40px 20px 80px; gap:20px;
    }
    .mood-wheel-page.active { display:flex; }
    .wheel-title { font-size:16px; font-weight:600; color:var(--text2); letter-spacing:2px; }
    .wheel-hint { font-size:13px; color:var(--text3); margin-top:4px; }
    .wheel-container {
      position:relative; width:min(75vw,280px); height:min(75vw,280px);
    }
    .wheel-container canvas {
      width:100%; height:100%; border-radius:50%;
      border:3px solid var(--accent);
      box-shadow:0 0 30px rgba(154,125,84,.2);
      cursor:pointer;
    }
    .wheel-result { font-size:32px; font-weight:700; color:var(--accent); text-align:center; min-height:40px; }
    .wheel-result-label { font-size:13px; color:var(--text3); text-align:center; }
    .wheel-done-btn {
      margin-top:8px; background: linear-gradient(135deg, var(--accent3), var(--accent)); color:#fff; border:none;
      border-radius:100px; padding:10px 32px; font-size:14px; font-weight:600;
      cursor:pointer; font-family:inherit; transition:opacity .15s, transform .15s;
    }
    .wheel-done-btn:hover { opacity:.85; transform:translateY(-1px); }
    .wheel-done-btn:hover { opacity:.85; }

    /* ===== MOOD WHEEL OVERLAY ===== */
    .mood-wheel-overlay {
      position: fixed; inset: 0; z-index: 180;
      background: var(--bg);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px 80px; gap: 20px;
    }
    .mood-wheel-overlay.active { display: flex; }

    /* ===== MOOD CLINIC ON HOME ===== */
    .mood-clinic-section {
      margin: 24px 16px 80px;
      padding: 24px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .mood-clinic-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    .mood-clinic-sun {
      width: min(28vw, 140px);
      height: min(28vw, 140px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f7dfa0, #d9b35e, #9a7d54);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(12vw, 56px);
      cursor: pointer;
      box-shadow: 0 0 40px rgba(217,179,94,.3), 0 0 80px rgba(217,179,94,.08);
      transition: transform .15s, box-shadow .15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      animation: sunPulse 3s ease-in-out infinite;
      margin: 0 auto;
      position: relative;
    }
    .mood-clinic-sun:active { transform: scale(.95); box-shadow: 0 0 16px rgba(212,165,74,.3); animation: none; }
    .mood-clinic-sun.pressing { transform: scale(1.08); box-shadow: 0 0 50px rgba(212,165,74,.5), 0 0 100px rgba(212,165,74,.2); animation: none; }
    .mood-clinic-sun .sun-ring {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 3px solid transparent; border-top-color: rgba(255,223,120,.9);
      opacity: 0; transition: opacity .2s;
    }
    .mood-clinic-sun.pressing .sun-ring {
      opacity: 1;
      animation: sunRingRotate 1s linear infinite;
    }
    @keyframes sunRingRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .mood-clinic-sun .sun-glow {
      position: absolute; inset: -20px; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(255,220,100,.15) 25%, transparent 50%, rgba(255,220,100,.1) 75%, transparent 100%);
      opacity: 0; transition: opacity .3s;
    }
    .mood-clinic-sun.pressing .sun-glow {
      opacity: 1;
      animation: sunGlowSpin 2s linear infinite;
    }
    @keyframes sunGlowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .mood-clinic-hint {
      font-size: 12px;
      color: var(--text3);
      margin-top: 12px;
    }

    /* ===== TODO PAGE ===== */
    .todo-page { padding: 0 16px 80px; }
    .todo-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 16px 0 12px;
    }
    .todo-header-title {
      font-size: 22px; font-weight: 700;
      color: var(--text);
    }
    .todo-header-count {
      font-size: 13px; color: var(--text3);
    }
    .todo-filters {
      display: flex; gap: 8px;
      padding-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .todo-filters::-webkit-scrollbar { display: none; }
    .todo-filter {
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 13px; font-weight: 500;
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
      font-family: inherit;
    }
    .todo-filter.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .todo-fab {
      position: fixed;
      bottom: 80px; right: 16px;
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent3), var(--accent));
      color: #fff; border: none;
      font-size: 28px; font-weight: 300;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(154,125,84,.35);
      transition: transform .15s, box-shadow .15s;
      z-index: 120;
      font-family: inherit;
    }
    .todo-fab:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(154,125,84,.45); }
    .todo-fab:active { transform: scale(.95); }
    .todo-list { display: flex; flex-direction: column; gap: 8px; }
    .todo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .2s, opacity .2s;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .todo-item:active { transform: none; }
    .todo-item.completed {
      background: var(--surface2);
      opacity: 0.5;
    }
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text3);
    }
    .todo-item-inner {
      display: flex; align-items: center; gap: 12px; width: 100%;
    }
    .delete-option {
      display: none;
      background: var(--danger); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 5px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0;
    }
    .todo-item.show-delete .delete-option { display: inline-block; }
    .todo-text {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      word-break: break-word;
    }
    .todo-check {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .2s, border-color .2s;
      font-size: 12px;
      color: #fff;
      margin-left: 4px;
    }
    .todo-check:hover { background: rgba(154,125,84,0.1); }
    .todo-check.checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .todo-thumb {
      width: 48px; height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .todo-empty {
      text-align: center; padding: 60px 20px;
      color: var(--text3); font-size: 14px;
    }

    /* ===== TODO MODAL ===== */
    .todo-photo-preview {
      width: 100%; max-height: 160px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      margin-top: 10px;
      border: 1px solid var(--border);
      display: none;
    }
    .todo-photo-preview.show { display: block; }
    .todo-photo-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-size: 13px; cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: all .2s;
    }
    .todo-photo-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== TODO DETAIL PAGE ===== */
    .todo-detail-page {
      padding: 16px 16px 80px;
      min-height: 60vh;
    }
    .todo-detail-img {
      width: 100%; max-height: 280px;
      border-radius: var(--radius);
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .todo-detail-text {
      font-size: 17px; color: var(--text);
      line-height: 1.7;
      word-break: break-word;
    }
    .todo-detail-status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text3);
      margin-top: 12px;
      padding: 6px 12px;
      background: var(--surface2);
      border-radius: 100px;
      border: 1px solid var(--border);
    }
    .todo-edit-textarea {
      width: 100%; min-height: 120px;
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px; font-size: 16px; font-family: inherit;
      background: var(--surface); color: var(--text);
      resize: vertical; outline: none;
    }
    .todo-edit-textarea:focus { border-color: var(--accent); }
    .todo-edit-photo-wrap { margin: 12px 0; }
    .todo-edit-photo-preview {
      width: 100%; max-height: 200px; border-radius: var(--radius);
      object-fit: cover; border: 1px solid var(--border);
    }
    .todo-edit-photo-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border: 1px dashed var(--border);
      border-radius: var(--radius); background: var(--surface2);
      color: var(--text2); font-size: 13px; cursor: pointer;
    }

    /* ===== CALENDAR TAB ===== */
    .cal-page { padding:16px 16px 80px; }
    .cal-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:18px;
    }
    .cal-month-label { font-size:18px; font-weight:700; color:var(--text); }
    .cal-nav-btn {
      width:36px; height:36px; border-radius:50%;
      background:var(--surface2); border:1px solid var(--border);
      color:var(--text); font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s;
    }
    .cal-nav-btn:hover { background:var(--border); }
    .cal-weekdays {
      display:grid; grid-template-columns:repeat(7,1fr);
      gap:4px; margin-bottom:6px;
    }
    .cal-dow {
      text-align:center; font-size:12px; color:var(--text3);
      padding:6px 0; font-weight:500;
    }
    .cal-grid {
      display:grid; grid-template-columns:repeat(7,1fr);
      gap:4px;
    }
    .cal-cell {
      aspect-ratio:1; border-radius:10px;
      background:var(--surface); display:flex;
      flex-direction:column; align-items:center; justify-content:center;
      font-size:14px; color:var(--text2); cursor:default;
      border:1.5px solid transparent; transition:background .2s,border-color .2s;
      gap:1px;
    }
    .cal-cell.empty { background:transparent; }
    .cal-cell.today {
      border-color:var(--accent); background:rgba(154,125,84,0.08);
    }
    .cal-cell.today .cal-day-num { color:var(--accent); font-weight:700; }
    .cal-cell[data-mood="yes"] { background:rgba(154,125,84,0.06); }
    .cal-cell[data-mood="yes"] .cal-day-num { color:var(--accent); font-weight:600; }
    .cal-day-num { font-size:14px; line-height:1; }
    .cal-day-mood { font-size:9px; color:var(--accent); line-height:1; }
    .cal-today-tag {
      display:inline-block; font-size:9px; color:#fff;
      background:var(--accent); border-radius:4px;
      padding:1px 4px; margin-top:1px;
    }

    /* ===== ME TAB ===== */
    .me-page { padding:20px 16px 80px; }
    .me-topbar {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:20px;
    }
    .me-avatar-wrap {
      display:flex; align-items:center; gap:12px;
    }
    .me-avatar {
      width:56px; height:56px; border-radius:50%;
      object-fit:cover; border:2px solid var(--border);
      background:var(--surface2); cursor:pointer;
      transition:transform .2s;
    }
    .me-avatar:active { transform:scale(.95); }
    .me-name {
      font-size:18px; font-weight:600; color:var(--text);
    }
    .me-avatar-actions {
      display:flex; flex-direction:column; align-items:center; gap:4px;
    }
    .me-avatar-btn {
      width:36px; height:36px; border-radius:50%;
      border:1px solid var(--border); background:var(--surface);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; cursor:pointer; color:var(--text2);
      transition:background .2s;
    }
    .me-avatar-btn:hover { background:var(--surface2); }
    .me-avatar-label {
      font-size:10px; color:var(--text3);
    }
    .me-profile-title {
      font-size:15px; font-weight:600; color:var(--accent);
      margin:20px 0 10px; padding-bottom:6px;
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:6px;
    }
    .me-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:14px 16px;
      margin-bottom:10px; box-shadow:var(--shadow-sm);
      cursor:pointer; transition:transform .2s,box-shadow .2s;
    }
    .me-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
    .me-card-title {
      font-size:15px; font-weight:600; color:var(--text);
      margin-bottom:4px;
    }
    .me-card-hint {
      font-size:12px; color:var(--text3);
    }
    .me-card-value {
      font-size:14px; color:var(--accent); font-weight:600;
      margin-top:4px;
    }
    .me-sub-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    }
    .me-sub-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:12px 8px;
      text-align:center; cursor:pointer; transition:all .2s;
      min-height:80px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:4px;
    }
    .me-sub-card:hover { border-color:var(--accent3); }
    .me-sub-card.add {
      border-style:dashed; color:var(--text3);
    }
    .me-sub-card-title {
      font-size:13px; font-weight:500; color:var(--text);
    }
    .me-sub-card-count {
      font-size:11px; color:var(--text3);
    }
    .me-section {
      margin-bottom:16px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
      .tasks-grid { grid-template-columns: repeat(2, 1fr); }
      .mood-btn { padding: 6px 12px; font-size: 12px; }
      .welcome-card { padding: 28px 20px 20px; }
      .template-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .tab-item { font-size: 9px; }
      .tab-item .tab-icon { font-size: 20px; }
      .emotion-chip { padding:6px 14px; font-size:12px; }
      .wheel-container { width:min(70vw,250px); height:min(70vw,250px); }
    }
  </style>
</head>
<body>

<!-- ===================== WELCOME MODAL ===================== -->
<div class="welcome-backdrop" id="welcome-overlay">
  <div class="welcome-card" id="welcome-card">

    </div>

</div>

  </div>
  <button class="todo-fab" onclick="openTodoModal()">+</button>
</div>

<!-- ===================== TODO CREATE MODAL ===================== -->
<div class="modal-overlay" id="modal-todo" onclick="closeModalIfBg(event)">

      <label>内容</label>

        onkeydown="if(event.key==='Enter')createTodo()" />

    <div class="anni-form-row">
      <button class="todo-photo-btn" onclick="document.getElementById('todo-photo-input').click()">
        📎 添加照片

      <img class="todo-photo-preview" id="todo-photo-preview" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeTodoModal()">取消</button>
      <button class="btn btn-primary" onclick="createTodo()">创建</button>
    </div>
  </div>
</div>

<!-- ===================== TODO DETAIL PAGE ===================== -->
<div id="view-todo-detail" class="view">
  <div class="topbar">
    <button class="back-btn" onclick="goBackToTodoTab()">‹</button>
    <h1>待办详情</h1>
  </div>
  <div class="scroll-area">
    <div class="todo-detail-page" id="todo-detail-page"></div>
  </div>
</div>

<!-- ===================== TAB 3: 日历 ===================== -->
<div id="view-tab-calendar" class="tab-view">
  <div class="cal-page">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeCalMonth(-1)">‹</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button class="cal-nav-btn" onclick="changeCalMonth(1)">›</button>
    </div>

      <div class="anni-section-header">

      </div>
      <div class="anni-section-hint" id="anni-section-hint">记录重要的日子</div>
      <div class="anni-preview-list" id="anni-preview-list"></div>
    </div>
  </div>
</div>

<!-- ===================== TAB 4: 我 ===================== -->
<div id="view-tab-me" class="tab-view">
  <div class="me-page">
    <div class="me-topbar">
      <div class="me-avatar-wrap">
        <img class="me-avatar" id="me-avatar-img" src="" alt="头像" onclick="openAvatarLightbox()" />

    <div class="me-section">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <span style="font-size:14px;font-weight:600;color:var(--text);">🧠 心理困惑</span>
        <span style="font-size:11px;color:var(--text3);">点击卡片记录，长按删除</span>
      </div>
      <div class="me-sub-grid" id="me-confusion-grid"></div>
    </div>

    <div class="me-section">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">

<!-- ===================== AVATAR LIGHTBOX ===================== -->

async function apiFetch(table, method, body, query) {
  let url = API + '/' + table;
  if (query) url += '?' + query;
  const opts = { method, headers: { ...supabaseHeaders } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('API error ' + res.status);
  if (res.status === 204) return null;
  return res.json();
}

async function syncLocalToCloud() {
  const localData = loadLocalData();
  if (localData.tasks.length === 0) return;
  for (const task of localData.tasks) {
    try {
      const existing = await apiFetch('tasks', 'GET', null,
        'name=eq.' + encodeURIComponent(task.name));
      let cloudTask;
      if (existing && existing.length > 0) {
        cloudTask = existing[0];
      } else {
        const result = await apiFetch('tasks', 'POST', { name: task.name });
        cloudTask = Array.isArray(result) ? result[0] : result;
      }
      if (task.records && task.records.length > 0) {
        for (const rec of task.records) {
          try {
            await apiFetch('records', 'POST', {
              task_id: cloudTask.id,
              text: rec.text || '',
              images: rec.images || []
            });
          } catch(e) { /* skip duplicate */ }
        }
      }
    } catch(e) {
      console.error('Sync task error:', e);

  }
}

function drawWheel() {
  const canvas = document.getElementById('wheel-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2, r = w/2 - 10;
  const n = 11;
  const segAngle = 2 * Math.PI / n;

  const colors = [
    '#7b7d8e','#87808a','#93837e','#9f8973','#a9916a',
    '#a0845c',
    '#8fa67a','#80b47a','#6ec48a','#5dd49e','#4de4b2'
  ];

  ctx.clearRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    const start = i * segAngle - Math.PI/2;
    const end = start + segAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();

    if (i === wheelSelected) {
      ctx.fillStyle = '#c4956a';
      ctx.fill();
      ctx.strokeStyle = '#a0845c';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else {
      ctx.fillStyle = colors[i];
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const mid = start + segAngle / 2;
    const tr = r * 0.72;
    const tx = cx + tr * Math.cos(mid);
    const ty = cy + tr * Math.sin(mid);
    ctx.fillStyle = '#fff';
    ctx.font = (i === wheelSelected) ? 'bold 34px sans-serif' : 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i), tx, ty);
  }

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 38, 0, 2*Math.PI);
  ctx.fillStyle = '#faf6f0';
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,132,92,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Center icon
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'var(--accent)';
  ctx.fillText('🌤', cx, cy);
}

function initWheelClick() {
  const canvas = document.getElementById('wheel-canvas');
  if (!canvas || canvas._clickReady) return;
  canvas._clickReady = true;

  function getSegment(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const dx = x - cx;
    const dy = y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const r = canvas.width / 2 - 10;
    if (dist < 38 || dist > r) return -1;
    let angle = Math.atan2(dy, dx) + Math.PI / 2;
    if (angle < 0) angle += Math.PI * 2;
    const segAngle = (Math.PI * 2) / 11;
    return Math.floor(angle / segAngle);
  }

  canvas.addEventListener('click', function(e) {
    const seg = getSegment(e.clientX, e.clientY);
    if (seg >= 0 && seg <= 10) {
      wheelSelected = seg;
      drawWheel();
      onWheelResult(seg);
    }
  });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    const seg = getSegment(t.clientX, t.clientY);
    if (seg >= 0 && seg <= 10) {
      wheelSelected = seg;
      drawWheel();
      onWheelResult(seg);
    }
  });
}

function onWheelResult(num) {
  document.getElementById('wheel-result').textContent = num;
  const labels = ['冰点','很低','低','偏低','中等','还行','不错','挺好','很好','很棒','满格'];
  document.getElementById('wheel-result-label').textContent = `心情温度 ${num}/10 · ${labels[num]}`;
  document.getElementById('wheel-done-btn').style.display = '';

  // Save
  const now = new Date();

  data[today].temp = num;
  data[today].tempTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  data[today].words = moodSession.selected;
  saveMoodData(data);
}

}

/* --- Me page: mood curve --- */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${calYear}年${calMonth + 1}月`;

  const dayNames = ['日','一','二','三','四','五','六'];
  const wdContainer = document.getElementById('cal-weekdays');
  wdContainer.innerHTML = dayNames.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const now = new Date();
  const todayDate = now.getDate();
  const todayMonth = now.getMonth();
  const todayYear = now.getFullYear();

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  const moodData = loadMoodData();
  for (let day = 1; day <= daysInMonth; day++) {
    const el = document.createElement('div');
    el.className = 'cal-cell';
    const dateKey = `${calYear}-${String(calMonth + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const hasMood = moodData[dateKey]?.temp !== undefined;
    const hasWords = (moodData[dateKey]?.words || []).length > 0;
    if (hasMood) el.dataset.mood = 'yes';
    const isToday = (day === todayDate && calMonth === todayMonth && calYear === todayYear);
    if (isToday) el.classList.add('today');

    let inner = `<span class="cal-day-num">${day}</span>`;
    if (hasMood) {
      inner += `<span class="cal-day-mood">${moodData[dateKey].temp}°</span>`;
    }
    if (isToday) {
      inner += `<span class="cal-today-tag">今</span>`;
    }
    el.innerHTML = inner;
    grid.appendChild(el);
  }
  renderAnniPreview();
}

function changeCalMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

/* ======================== UTILS ======================== */
function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDatetime(ts) {
  const d = new Date(ts);
  const date = formatDate(ts);
  const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `${date} ${time}`;
}

function todayStr() { return formatDate(Date.now()); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Hide tab bar when entering sub-views (detail, heatmap, anniversary)
  const tabBar = document.getElementById('tab-bar');
  if (id === 'view-detail' || id === 'view-heatmap' || id === 'view-anniversary' || id === 'view-anni-detail' || id === 'view-todo-detail' || id === 'view-settings' || id === 'view-avatar-lightbox') {
    tabBar.classList.add('hidden');
  } else {
    tabBar.classList.remove('hidden');
  }
  window.scrollTo(0, 0);
}

function switchTab(tabName) {
  currentTab = tabName;
  // Hide all tab views
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  // Show selected tab
  document.getElementById('view-tab-' + tabName).classList.add('active');
  // Update tab bar
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tabName).classList.add('active');
  // Show tab bar
  document.getElementById('tab-bar').classList.remove('hidden');
  // Hide sub-views
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  window.scrollTo(0, 0);

  // Tab-specific init
  if (tabName === 'mood') {
    renderTodos();
  }
  if (tabName === 'calendar') {
    calYear = new Date().getFullYear();
    calMonth = new Date().getMonth();
    renderCalendar();
  }
  if (tabName === 'me') {
    renderMePage();

/* ======================== IMAGE COMPRESSION ======================== */
function compressImage(dataUrl, maxWidth, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

function goHeatmap() {

  renderHeatmap(task);

function changeMonth(delta) {
  heatmapMonth += delta;
  if (heatmapMonth < 0) { heatmapMonth = 11; heatmapYear--; }
  if (heatmapMonth > 11) { heatmapMonth = 0; heatmapYear++; }
  const task = getTaskFromCache(currentTaskId);
  if (task) renderHeatmap(task);
}

function renderHeatmap(task) {
  const y = heatmapYear, m = heatmapMonth;
  document.getElementById('heatmap-month-label').textContent = `${y}年${m+1}月`;

  const countMap = {};
  (task.records || []).forEach(r => {
    const d = new Date(r.created_at || r.ts);
    if (d.getFullYear() === y && d.getMonth() === m) {
      const key = String(d.getDate());
      countMap[key] = (countMap[key] || 0) + 1;
    }
  });

  const maxCount = Math.max(1, ...Object.values(countMap));

  function getLevel(count) {
    if (!count) return 0;
    if (count <= 3) return 1;
    return 2;
  }

  const grid = document.getElementById('heatmap-grid');
  grid.innerHTML = '';

  ['日','一','二','三','四','五','六'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'heatmap-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  const todayStr2 = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'heatmap-cell empty';
    grid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const count = countMap[String(day)] || 0;
    const level = getLevel(count);
    const el = document.createElement('div');
    el.className = 'heatmap-cell';
    if (level > 0) el.dataset.level = level;
    el.textContent = day;
    const isTodayCell = `${y}-${m}-${day}` === todayStr2;
    if (isTodayCell) el.classList.add('today');
    if (count > 0) el.title = `${y}年${m+1}月${day}日：${count} 条记录`;
    grid.appendChild(el);
  }

  const totalThisMonth = Object.values(countMap).reduce((a,b)=>a+b,0);
  const activeDays = Object.keys(countMap).length;
  const maxDay = Object.entries(countMap).sort((a,b)=>b[1]-a[1])[0];
  const totalAll = (task.records || []).length;

  document.getElementById('heatmap-stats').innerHTML = `
    <h3>📊 统计</h3>
    <div class="stat-row"><span class="stat-label">本月记录</span><span class="stat-value">${totalThisMonth} 条</span></div>
    <div class="stat-row"><span class="stat-label">本月打卡天数</span><span class="stat-value">${activeDays} 天</span></div>
    <div class="stat-row"><span class="stat-label">本月最多单日</span><span class="stat-value">${maxDay ? maxDay[1]+' 条 ('+maxDay[0]+'日)' : '—'}</span></div>
    <div class="stat-row"><span class="stat-label">全部记录</span><span class="stat-value">${totalAll} 条</span></div>
  `;
}

function computeAnniDays(dateStr) {
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const diff = Math.round((now - target) / (1000 * 60 * 60 * 24));
  return diff;
}

    hintEl.textContent = list.length === 0 ? '记录重要的日子' : '';
  }
  if (!listEl) return;
  listEl.innerHTML = '';
  // Show top 3, sorted by absolute days (closest first)
  const sorted = [...list].sort((a, b) => {
    const da = Math.abs(computeAnniDays(a.date));
    const db = Math.abs(computeAnniDays(b.date));
    return da - db;
  }).slice(0, 3);

  sorted.forEach(item => {

  document.getElementById('todo-filter-' + filter).classList.add('active');
  renderTodos();
