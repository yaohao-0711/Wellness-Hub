<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>心理小屋</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#a0845c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="心理小屋" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23a0845c'/%3E%3Ccircle cx='96' cy='78' r='28' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M96 106 L96 130' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M80 96 Q96 116 112 96' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cellipse cx='86' cy='74' rx='4' ry='5' fill='%23fff'/%3E%3Cellipse cx='106' cy='74' rx='4' ry='5' fill='%23fff'/%3E%3Crect x='80' y='136' width='32' height='4' rx='2' fill='%23fff' opacity='0.5'/%3E%3Crect x='74' y='144' width='44' height='4' rx='2' fill='%23fff' opacity='0.3'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #faf6f0;
      --surface: #fffcf7;
      --surface2: #f5efe6;
      --border: #e8ddd0;
      --accent: #a0845c;
      --accent2: #8fa67a;
      --accent3: #c4956a;
      --text: #3d3426;
      --text2: #8c7e6a;
      --text3: #b5a99a;
      --danger: #c0392b;
      --green: #8fa67a;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== VIEWS ===== */
    .view { display: none; min-height: 100vh; }
    .view.active { display: flex; flex-direction: column; }

    /* ===== TOP BAR ===== */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex; align-items: center; gap: 12px;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; }
    .topbar .back-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); font-size: 18px; transition: background .2s;
    }
    .topbar .back-btn:hover { background: var(--border); }
    .topbar .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 18px; transition: background .2s;
    }
    .topbar .icon-btn:hover { background: var(--border); }

    /* ===== SCROLL AREA ===== */
    .scroll-area {
      flex: 1; overflow-y: auto; padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ===== HOME VIEW ===== */
    .home-header {
      padding: 28px 16px 16px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .home-header .greeting { font-size: 22px; font-weight: 700; color: var(--accent); }
    .home-header .date-label { font-size: 13px; color: var(--text2); margin-top: 4px; }
    .add-task-btn {
      background: var(--accent);
      color: #fff; border: none; border-radius: 50%;
      width: 44px; height: 44px; font-size: 24px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(160,132,92,0.35);
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .add-task-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(160,132,92,0.5); }

    /* Task cards */
    .tasks-grid {
      padding: 0 16px 80px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
      position: relative; overflow: hidden;
    }
    .task-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent3); border-radius: 3px 0 0 3px;
    }
    .task-card:hover { transform: translateY(-2px); border-color: var(--accent3); box-shadow: 0 8px 24px rgba(160,132,92,.12); }
    .task-card .task-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .task-card .task-stats { font-size: 12px; color: var(--text2); }
    .task-card .task-total { font-size: 24px; font-weight: 700; color: var(--accent); }
    .task-card .task-total-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .task-card .today-dot {
      position: absolute; top: 12px; right: 12px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    }
    .task-card .delete-btn {
      position: absolute; bottom: 10px; right: 10px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(192,57,43,0.08); border: 1px solid var(--danger);
      color: var(--danger); font-size: 12px; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .task-card:hover .delete-btn { display: flex; }
    .task-card .delete-btn:hover { background: var(--danger); color: #fff; }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text3);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; line-height: 1.6; }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(61,52,38,.35); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 20px 20px 32px;
      width: 100%; max-width: 520px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-sheet h2 { font-size: 17px; margin-bottom: 16px; color: var(--accent); }

    /* ===== TASK TEMPLATE GRID ===== */
    .template-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    .template-card {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
      text-align: center;
    }
    .template-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--surface);
    }
    .template-card:active {
      transform: scale(0.97);
    }
    .template-card .tpl-icon {
      font-size: 24px; margin-bottom: 6px;
    }
    .template-card .tpl-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      margin-bottom: 3px;
    }
    .template-card .tpl-desc {
      font-size: 10px; color: var(--text3); line-height: 1.4;
    }
    .template-card.selected {
      border-color: var(--accent);
      background: rgba(160,132,92,0.08);
    }

    /* Custom task input */
    .custom-task-section {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .custom-task-section label {
      font-size: 12px; color: var(--text3); margin-bottom: 8px; display: block;
    }
    .input-field {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 15px; padding: 12px 14px;
      outline: none; transition: border-color .2s;
      font-family: inherit;
    }
    .input-field:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 12px; border-radius: var(--radius-sm);
      border: none; cursor: pointer; font-size: 15px; font-weight: 600;
      font-family: inherit; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text2); }

    /* ===== TASK DETAIL VIEW ===== */
    .records-list {
      display: flex; flex-direction: column-reverse;
      gap: 10px; padding-bottom: 16px;
    }
    .record-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
    }
    .record-item .record-time {
      font-size: 11px; color: var(--text3); margin-bottom: 8px;
    }
    .record-item .record-content { font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .record-item .record-images {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .record-item .record-img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--border);
    }
    .record-del {
      position: absolute; top: 10px; right: 10px;
      background: transparent; border: none; cursor: pointer;
      color: var(--text3); font-size: 14px; padding: 4px;
      transition: color .2s;
    }
    .record-del:hover { color: var(--danger); }

    /* Add record area */
    .add-record-area {
      position: sticky; bottom: 0; z-index: 10;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 16px 16px;
    }
    .add-record-textarea {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 15px; padding: 10px 12px;
      outline: none; resize: none; font-family: inherit;
      transition: border-color .2s; min-height: 72px; max-height: 180px;
    }
    .add-record-textarea:focus { border-color: var(--accent); }
    .add-record-controls {
      display: flex; align-items: center; gap: 10px; margin-top: 8px;
    }
    .img-upload-label {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; color: var(--accent); font-size: 18px;
      transition: background .2s;
    }
    .img-upload-label:hover { background: var(--border); }
    #img-input { display: none; }
    .img-previews {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
    }
    .img-preview-wrap {
      position: relative; width: 56px; height: 56px;
    }
    .img-preview-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: var(--radius-sm); border: 1px solid var(--border);
    }
    .img-preview-wrap .remove-img {
      position: absolute; top: -5px; right: -5px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--danger); color: #fff; border: none;
      cursor: pointer; font-size: 10px; display: flex;
      align-items: center; justify-content: center;
    }
    .submit-btn {
      margin-left: auto; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 8px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity .15s;
    }
    .submit-btn:hover { opacity: .85; }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ===== HEATMAP VIEW ===== */
    .heatmap-container { padding: 16px 16px 40px; }
    .heatmap-month-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .month-nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .month-nav-btn:hover { background: var(--border); }
    .month-label { font-size: 16px; font-weight: 600; }
    .heatmap-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .heatmap-dow {
      text-align: center; font-size: 11px; color: var(--text3);
      padding-bottom: 4px;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 5px;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--text3);
      position: relative; cursor: default;
      border: 1px solid transparent;
      transition: transform .1s;
    }
    .heatmap-cell.today { border-color: var(--accent); }
    .heatmap-cell.empty { background: transparent; }
    .heatmap-cell[data-level="1"] { background: rgba(160,132,92,0.15); color: var(--text2); }
    .heatmap-cell[data-level="2"] { background: rgba(160,132,92,0.30); color: var(--text); }
    .heatmap-cell[data-level="3"] { background: rgba(160,132,92,0.50); color: var(--text); }
    .heatmap-cell[data-level="4"] { background: rgba(160,132,92,0.75); color: #fff; font-weight: 700; }
    .heatmap-cell:hover { transform: scale(1.1); }
    .heatmap-legend {
      display: flex; align-items: center; gap: 6px;
      margin-top: 18px; font-size: 12px; color: var(--text3);
      justify-content: flex-end;
    }
    .legend-box {
      width: 14px; height: 14px; border-radius: 3px;
    }
    .heatmap-stats {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px; margin-top: 20px;
    }
    .heatmap-stats h3 { font-size: 14px; color: var(--text2); margin-bottom: 12px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-label { font-size: 13px; color: var(--text2); }
    .stat-value { font-size: 15px; font-weight: 700; color: var(--accent); }

    /* ===== IMAGE LIGHTBOX ===== */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.92); align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: var(--radius-sm); }
    .lightbox-close {
      position: absolute; top: 16px; right: 16px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: none; cursor: pointer;
      color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 20px; border-radius: 100px;
      font-size: 14px; z-index: 500; opacity: 0; pointer-events: none;
      transition: opacity .3s; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .toast.show { opacity: 1; }

    /* ===== SYNC BADGE ===== */
    .sync-badge {
      position: fixed; top: 60px; right: 12px; z-index: 150;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 100px; padding: 4px 10px;
      font-size: 11px; color: var(--text3);
      display: none; align-items: center; gap: 4px;
    }
    .sync-badge.active { display: flex; }
    .sync-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .sync-badge .dot.green { background: var(--green); }
    .sync-badge .dot.yellow { background: var(--accent3); }

    /* ===== WELCOME MODAL ===== */
    .welcome-backdrop {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(61,52,38,.3); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px 24px;
      max-width: 380px; width: 100%;
      text-align: center;
      animation: cardPop .35s cubic-bezier(.2,.9,.3,1.1);
      position: relative;
      box-shadow: 0 20px 60px rgba(160,132,92,.15);
    }
    @keyframes cardPop {
      from { opacity: 0; transform: scale(.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .welcome-card.hiding {
      animation: cardOut .3s ease forwards;
    }
    @keyframes cardOut {
      to { opacity: 0; transform: scale(.9) translateY(10px); }
    }
    .welcome-card .welcome-logo {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      background: var(--accent);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(160,132,92,.3);
    }
    .welcome-card .welcome-app-name {
      font-size: 14px; font-weight: 600;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 20px;
    }
    .welcome-card .welcome-quote {
      font-size: 16px; font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .welcome-card .welcome-sub {
      font-size: 11px; color: var(--text3);
      margin-bottom: 28px;
    }
    .welcome-card .mood-label {
      font-size: 12px; color: var(--text2);
      margin-bottom: 12px;
    }
    .mood-options {
      display: flex; gap: 8px; justify-content: center; flex-wrap: nowrap;
    }
    .mood-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
      color: var(--text2);
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .mood-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .mood-btn:active {
      transform: scale(0.95);
    }
    .welcome-skip {
      display: block; margin-top: 20px;
      font-size: 12px; color: var(--text3);
      text-align: center; cursor: pointer;
      border: none; background: none;
      font-family: inherit; padding: 4px 0;
      transition: color .2s;
    }
    .welcome-skip:hover {
      color: var(--text2);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
      .tasks-grid { grid-template-columns: repeat(2, 1fr); }
      .mood-btn { padding: 6px 12px; font-size: 12px; }
      .welcome-card { padding: 28px 20px 20px; }
      .template-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    }
  </style>
</head>
<body>

<!-- ===================== WELCOME MODAL ===================== -->
<div class="welcome-backdrop" id="welcome-overlay">
  <div class="welcome-card" id="welcome-card">
    <div class="welcome-logo">🏠</div>
    <div class="welcome-app-name">心理小屋</div>
    <div class="welcome-quote" id="welcome-quote">坚持就是胜利</div>
    <div class="welcome-sub">每一天的努力，都算数</div>
    <div class="mood-label">今天的你心情怎么样？</div>
    <div class="mood-options" id="mood-options"></div>
    <button class="welcome-skip" onclick="skipWelcome()">跳过</button>
  </div>
</div>

<!-- ===================== SYNC BADGE ===================== -->
<div class="sync-badge" id="sync-badge">
  <div class="dot" id="sync-dot"></div><span id="sync-text">本地存储</span>
</div>

<!-- ===================== HOME VIEW ===================== -->
<div id="view-home" class="view active">
  <div class="home-header">
    <div>
      <div class="greeting">心理小屋 🏠</div>
      <div class="date-label" id="home-date"></div>
    </div>
    <button class="add-task-btn" onclick="openNewTaskModal()" title="新建任务">+</button>
  </div>
  <div class="tasks-grid" id="tasks-grid"></div>
</div>

<!-- ===================== TASK DETAIL VIEW ===================== -->
<div id="view-detail" class="view">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">‹</button>
    <h1 id="detail-title">任务名称</h1>
    <button class="icon-btn" onclick="goHeatmap()" title="查看热力图">◫</button>
  </div>
  <div class="scroll-area" id="detail-records">
    <div class="records-list" id="records-list"></div>
  </div>
  <div class="add-record-area">
    <textarea class="add-record-textarea" id="record-text" placeholder="记录今天的想法、感悟…" oninput="autoResize(this)"></textarea>
    <div class="img-previews" id="img-previews"></div>
    <div class="add-record-controls">

async function apiFetch(table, method, body, query) {
  let url = API + '/' + table;
  if (query) url += '?' + query;
  const opts = { method, headers: { ...supabaseHeaders } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('API error ' + res.status);
  if (res.status === 204) return null;
  return res.json();
}

async function testCloudConnection() {
  try {
    await apiFetch('tasks', 'GET', null, 'select=id&limit=1');

  } catch(e) {
    return false;

async function syncLocalToCloud() {
  const localData = loadLocalData();
  if (localData.tasks.length === 0) return;
  for (const task of localData.tasks) {
    try {
      const existing = await apiFetch('tasks', 'GET', null,
        'name=eq.' + encodeURIComponent(task.name));
      let cloudTask;
      if (existing && existing.length > 0) {
        cloudTask = existing[0];
      } else {
        const result = await apiFetch('tasks', 'POST', { name: task.name });
        cloudTask = Array.isArray(result) ? result[0] : result;
      }
      if (task.records && task.records.length > 0) {
        for (const rec of task.records) {
          try {
            await apiFetch('records', 'POST', {
              task_id: cloudTask.id,
              text: rec.text || '',
              images: rec.images || []
            });
          } catch(e) { /* skip duplicate */ }
        }
      }
    } catch(e) {
      console.error('Sync task error:', e);
    }
  }

      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,

        t.records = records || [];
      }
      tasksCache = tasks;
      saveLocalData({ tasks: tasksCache.map(t => ({

  const task = { id: localId, name, created_at: now, records: [] };
  if (cloudAvailable) {

      task.id = cloudTask.id;

      console.error('Cloud create task failed:', e);
    }
  }
  tasksCache.push(task);
  saveToLocal();
  return task;
}

async function deleteTaskDB(id) {

    try {
      await apiFetch('records', 'DELETE', null, 'task_id=eq.' + id);
      await apiFetch('tasks', 'DELETE', null, 'id=eq.' + id);
    } catch(e) {
      console.error('Cloud delete task failed:', e);

  }
  tasksCache = tasksCache.filter(t => t.id !== id);
  saveToLocal();
}

async function createRecordDB(taskId, text, images) {
  const localId = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const now = new Date().toISOString();
  const record = { id: localId, task_id: taskId, text: text || '', images: images || [], created_at: now };
  if (cloudAvailable) {
    try {
      const result = await apiFetch('records', 'POST', {
        task_id: taskId, text: text || '', images: images || []
      });
      const cloudRecord = Array.isArray(result) ? result[0] : result;
      record.id = cloudRecord.id;
    } catch(e) {
      console.error('Cloud create record failed:', e);
    }
  }
  const task = tasksCache.find(t => t.id === taskId);
  if (task) task.records.push(record);
  saveToLocal();
  return record;
}

async function deleteRecordDB(id) {
  if (cloudAvailable) {
    try {
      await apiFetch('records', 'DELETE', null, 'id=eq.' + id);

      console.error('Cloud delete record failed:', e);
    }

  for (const t of tasksCache) {
    t.records = t.records.filter(r => r.id !== id);

}

function formatDatetime(ts) {

}

/* ======================== IMAGE COMPRESSION ======================== */
function compressImage(dataUrl, maxWidth, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

  }
  try {
    const compressedImages = [];
    for (const img of pendingImages) {
      const compressed = await compressImage(img, 800, 0.7);
      compressedImages.push(compressed);
    }

    await createRecordDB(currentTaskId, text, compressedImages);
    document.getElementById('record-text').value = '';
    document.getElementById('record-text').style.height = 'auto';
    pendingImages = [];
    renderImagePreviews();

    const task = getTaskFromCache(currentTaskId);
    if (task) renderRecords(task);

}

async function deleteRecord(rid) {
  if (!confirm('删除这条记录？')) return;
  try {
    await deleteRecordDB(rid);
    const task = getTaskFromCache(currentTaskId);
    if (task) renderRecords(task);
    showToast('记录已删除');
  } catch (e) {
    showToast('❌ 删除失败');
    console.error(e);
  }
}

/* ======================== HEATMAP ======================== */
function goHeatmap() {
  heatmapYear = new Date().getFullYear();
  heatmapMonth = new Date().getMonth();
  const task = getTaskFromCache(currentTaskId);
  if (!task) return;
  document.getElementById('heatmap-title').textContent = task.name + ' · 热力图';
  renderHeatmap(task);
  setView('view-heatmap');
}

function changeMonth(delta) {
  heatmapMonth += delta;
  if (heatmapMonth < 0) { heatmapMonth = 11; heatmapYear--; }
  if (heatmapMonth > 11) { heatmapMonth = 0; heatmapYear++; }
  const task = getTaskFromCache(currentTaskId);
  if (task) renderHeatmap(task);
}

function renderHeatmap(task) {
  const y = heatmapYear, m = heatmapMonth;
  document.getElementById('heatmap-month-label').textContent = `${y}年${m+1}月`;

  const countMap = {};
  (task.records || []).forEach(r => {
    const d = new Date(r.created_at || r.ts);
    if (d.getFullYear() === y && d.getMonth() === m) {
      const key = String(d.getDate());
      countMap[key] = (countMap[key] || 0) + 1;
    }
  });

  const maxCount = Math.max(1, ...Object.values(countMap));

  function getLevel(count) {
    if (!count) return 0;
    const ratio = count / maxCount;
    if (ratio <= 0.25) return 1;
    if (ratio <= 0.5) return 2;
    if (ratio <= 0.75) return 3;
    return 4;
  }

  const grid = document.getElementById('heatmap-grid');
  grid.innerHTML = '';

  ['日','一','二','三','四','五','六'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'heatmap-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  const todayStr2 = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'heatmap-cell empty';
    grid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const count = countMap[String(day)] || 0;
    const level = getLevel(count);
    const el = document.createElement('div');
    el.className = 'heatmap-cell';
    if (level > 0) el.dataset.level = level;
    el.textContent = day;
    const isTodayCell = `${y}-${m}-${day}` === todayStr2;
    if (isTodayCell) el.classList.add('today');
    if (count > 0) el.title = `${y}年${m+1}月${day}日：${count} 条记录`;
    grid.appendChild(el);
  }

  const totalThisMonth = Object.values(countMap).reduce((a,b)=>a+b,0);
  const activeDays = Object.keys(countMap).length;
  const maxDay = Object.entries(countMap).sort((a,b)=>b[1]-a[1])[0];
  const totalAll = (task.records || []).length;

  document.getElementById('heatmap-stats').innerHTML = `
    <h3>📊 统计</h3>
    <div class="stat-row"><span class="stat-label">本月记录</span><span class="stat-value">${totalThisMonth} 条</span></div>
    <div class="stat-row"><span class="stat-label">本月打卡天数</span><span class="stat-value">${activeDays} 天</span></div>
    <div class="stat-row"><span class="stat-label">本月最多单日</span><span class="stat-value">${maxDay ? maxDay[1]+' 条 ('+maxDay[0]+'日)' : '—'}</span></div>
    <div class="stat-row"><span class="stat-label">全部记录</span><span class="stat-value">${totalAll} 条</span></div>
  `;
}

/* ======================== NAVIGATION ======================== */
async function goHome() {
  if (cloudAvailable) {
    try {
      const tasks = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,
          'task_id=eq.' + t.id + '&order=created_at.asc');
        t.records = records || [];
      }
      tasksCache = tasks;
      saveToLocal();
    } catch(e) { /* keep current cache */ }
  }
  renderHome();
  setView('view-home');
}

function goDetail() {
  const task = getTaskFromCache(currentTaskId);
  if (task) renderRecords(task);
  setView('view-detail');
}

/* ======================== LIGHTBOX ======================== */
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

/* ======================== ESCAPE HTML ======================== */
function escapeHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ======================== KEYBOARD ======================== */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') {
    const active = document.querySelector('.view.active');
    if (active && active.id === 'view-detail') submitRecord();
  }
  if (e.key === 'Escape') {
    closeLightbox();
    closeNewTaskModal();
  }
});

(async function init() {
  // Show welcome modal every time with rotating quote & random moods
  document.getElementById('welcome-quote').textContent = getNextQuote();
  renderMoodButtons();
  document.getElementById('welcome-overlay').style.display = 'flex';

  // First load local data immediately (no loading screen!)
  const localData = loadLocalData();
  tasksCache = localData.tasks || [];
  renderHome();
  updateSyncBadge('local');

  // Then try cloud in background
  try {
    cloudAvailable = await testCloudConnection();
    if (cloudAvailable) {
      const tasks = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,
          'task_id=eq.' + t.id + '&order=created_at.asc');
        t.records = records || [];
      }
      tasksCache = tasks;
      saveToLocal();
      renderHome();
      updateSyncBadge('cloud');

      if (localData.tasks && localData.tasks.length > 0 && tasks.length === 0) {
        await syncLocalToCloud();
        const reloaded = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
        for (const t of reloaded) {
          const recs = await apiFetch('records', 'GET', null,
            'task_id=eq.' + t.id + '&order=created_at.asc');
          t.records = recs || [];
        }
        tasksCache = reloaded;
        saveToLocal();
        renderHome();
      }
    }
  } catch(e) {
    console.log('Cloud unavailable, using local only');
  }
})();
