function toggleTodo(id, event) {
  if (event) event.stopPropagation();
  const list = loadTodos();
  const itemIdx = list.findIndex(t => t.id === id);
  if (itemIdx === -1) return;
  const item = list[itemIdx];

  item.completed = !item.completed;
  list.splice(itemIdx, 1); // 先从原位置移除

  if (item.completed) {
    item.completedAt = Date.now();
    // 插入位置：所有未完成之后，按 completedAt 降序排在已完成里
    let insertIdx = list.length;
    for (let i = 0; i < list.length; i++) {
      if (!list[i].completed) {
        insertIdx = i + 1; // 插在这个未完成的后面
      } else if ((list[i].completedAt || 0) < item.completedAt) {
        insertIdx = i; // 找到第一个更早完成的，插在它前面
        break;
      }
    }
    list.splice(insertIdx, 0, item);
  } else {
    delete item.completedAt;
    // 未完成的移到最顶部
    list.unshift(item);
  }
  saveTodos(list);
  renderTodos();
}

function deleteTodo(id) {
  const list = loadTodos().filter(t => t.id !== id);
  saveTodos(list);
  renderTodos();
  showToast('已删除');
}

let editingTodoId = null;
let editingTodoPhoto = null;

function openTodoDetail(id) {
  const list = loadTodos();
  const item = list.find(t => t.id === id);
  if (!item) return;
  editingTodoId = id;
  editingTodoPhoto = item.photo || null;
  renderTodoDetailView(item, false);
  setView('view-todo-detail');
}

function renderTodoDetailView(item, isEdit) {
  const page = document.getElementById('todo-detail-page');
  const statusText = item.completed ? '已完成' : '进行中';
  const statusIcon = item.completed ? '✓' : '○';
  if (isEdit) {
    page.innerHTML = `
      <div class="todo-edit-photo-wrap">
        ${editingTodoPhoto ? `<img class="todo-edit-photo-preview" src="${editingTodoPhoto}" onclick="openLightbox('${editingTodoPhoto}')" />` : ''}
        <label class="todo-edit-photo-btn">
          📷 ${editingTodoPhoto ? '更换照片' : '添加照片'}
          <input type="file" accept="image/*" style="display:none" onchange="handleTodoEditPhoto(this)">
        </label>
        ${editingTodoPhoto ? `<button class="btn btn-ghost" style="margin-left:8px;font-size:12px;padding:6px 10px;" onclick="editingTodoPhoto=null;renderTodoDetailView(loadTodos().find(t=>t.id===editingTodoId),true)">移除照片</button>` : ''}
      </div>
      <textarea class="todo-edit-textarea" id="todo-edit-text">${escapeHtml(item.text)}</textarea>
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="saveTodoEdit()">保存</button>
        <button class="btn btn-ghost" onclick="renderTodoDetailView(loadTodos().find(t=>t.id===editingTodoId),false)">取消</button>
      </div>
    `;
  } else {
    page.innerHTML = `
      ${item.photo ? `<img class="todo-detail-img" src="${item.photo}" onclick="openLightbox('${item.photo}')" />` : ''}
      <div class="todo-detail-text">${escapeHtml(item.text)}</div>
      <div class="todo-detail-status">${statusIcon} ${statusText} · ${new Date(item.createdAt).toLocaleDateString('zh-CN')}</div>
      <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="toggleTodo('${item.id}');openTodoDetail('${item.id}')">${item.completed ? '标记为未完成' : '标记为已完成'}</button>
        <button class="btn btn-ghost" onclick="renderTodoDetailView(loadTodos().find(t=>t.id===editingTodoId),true)">编辑</button>
        <button class="btn btn-ghost" style="color:var(--danger);border-color:var(--danger);" onclick="if(confirm('删除这条待办？')){deleteTodo('${item.id}');goBackToTodoTab();}">删除</button>
      </div>
    `;
  }
}

function handleTodoEditPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    editingTodoPhoto = e.target.result;
    const item = loadTodos().find(t => t.id === editingTodoId);
    if (item) renderTodoDetailView(item, true);
  };
  reader.readAsDataURL(file);
}

function saveTodoEdit() {
  const text = document.getElementById('todo-edit-text').value.trim();
  if (!text) { showToast('内容不能为空'); return; }
  const list = loadTodos();
  const item = list.find(t => t.id === editingTodoId);
  if (!item) return;
  item.text = text;
  item.photo = editingTodoPhoto || null;
  saveTodos(list);
  renderTodoDetailView(item, false);
  renderTodos();
  showToast('已保存');
}

function goBackToTodoTab() {
  switchTab('mood');
}

function renderTodos() {
  const list = loadTodos();
  const countEl = document.getElementById('todo-header-count');
  if (countEl) countEl.textContent = `共 ${list.length} 条`;

  let displayList = list;
  if (todoFilter === 'active') displayList = list.filter(t => !t.completed);
  if (todoFilter === 'completed') displayList = list.filter(t => t.completed);

  const container = document.getElementById('todo-list');
  if (!container) return;

  if (displayList.length === 0) {
    const emptyMap = { all: '暂无待办事项', active: '暂无进行中待办', completed: '暂无已完成待办' };
    container.innerHTML = `<div class="todo-empty">${emptyMap[todoFilter] || '暂无待办事项'}<br><span style="font-size:12px">点击右下角 + 添加</span></div>`;
    return;
  }

  container.innerHTML = displayList.map(t => `
    <div class="todo-item ${t.completed ? 'completed' : ''}" data-id="${t.id}">
      <div class="todo-item-inner" onclick="openTodoDetail('${t.id}')">
        ${t.photo ? `<img class="todo-thumb" src="${t.photo}" onclick="event.stopPropagation();openLightbox('${t.photo}')" />` : ''}
        <div class="todo-text">${escapeHtml(t.text)}</div>
        <button class="delete-option" onclick="event.stopPropagation();deleteTodo('${t.id}')">删除</button>
        <div class="todo-check ${t.completed ? 'checked' : ''}" onclick="toggleTodo('${t.id}', event)">${t.completed ? '✓' : ''}</div>
      </div>
    </div>
  `).join('');

  // Init long-press delete on each todo item
  container.querySelectorAll('.todo-item').forEach(initTodoLongPress);
}

/* ======================== TODO LONG-PRESS DELETE ======================== */
function initTodoLongPress(el) {
  let lpTimer = null;
  function startLP(e) {
    if (e.target.closest('.delete-option') || e.target.closest('.todo-check')) return;
    lpTimer = setTimeout(() => {
      lpTimer = null;
      document.querySelectorAll('.todo-item.show-delete').forEach(i => i.classList.remove('show-delete'));
      el.classList.add('show-delete');
    }, 600);
  }
  function endLP() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
  }
  el.addEventListener('touchstart', startLP, {passive: true});
  el.addEventListener('touchend', endLP);
  el.addEventListener('touchcancel', endLP);
  el.addEventListener('mousedown', startLP);
  el.addEventListener('mouseup', endLP);
  el.addEventListener('mouseleave', endLP);
}

// Click outside to hide delete buttons
document.addEventListener('click', e => {
  if (!e.target.closest('.todo-item.show-delete')) {
    document.querySelectorAll('.todo-item.show-delete').forEach(i => i.classList.remove('show-delete'));
  }
});

/* ======================== PROFILE / ME PAGE ======================== */
const PROFILE_KEY = 'wellness_profile';
const DEFAULT_CONFUSIONS = ['人际关系','工作压力','家庭矛盾','自我认同','未来焦虑','情绪管理'];
const DEFAULT_MINDSETS = ['完美主义','灾难化思维','非黑即白','过度概括','应该思维','贴标签'];

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveProfile(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
}
function ensureProfileDefaults() {
  const p = loadProfile();
  if (!p.name) p.name = '访客';
  if (!p.avatar) p.avatar = '';
  if (!p.mbti) p.mbti = { type: '', note: '' };
  if (!p.confusions) {
    p.confusions = DEFAULT_CONFUSIONS.map((title, i) => ({
      id: 'conf_' + i, title, content: ''
    }));
  }
  if (!p.mindsets) {
    p.mindsets = DEFAULT_MINDSETS.map((title, i) => ({
      id: 'mind_' + i, title, content: ''
    }));
  }
  saveProfile(p);
  return p;
}

function renderMePage() {
  const p = ensureProfileDefaults();
  const avatarEl = document.getElementById('me-avatar-img');
  if (avatarEl) {
    avatarEl.src = p.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23e8e0d5%22/%3E%3Ctext x=%2250%22 y=%2258%22 text-anchor=%22middle%22 font-size=%2240%22%3E%F0%9F%A7%91%3C/text%3E%3C/svg%3E';
  }
  const nameEl = document.getElementById('me-name');
  if (nameEl) nameEl.textContent = p.name;

  // MBTI section
  const mbtiSection = document.getElementById('me-mbti-section');
  if (mbtiSection) {
    mbtiSection.innerHTML = `
      <div class="me-card" onclick="openMbtiModal()">
        <div class="me-card-title">🔮 MBTI 类型</div>
        ${p.mbti.type ? `<div class="me-card-value">${escapeHtml(p.mbti.type)}</div>` : ''}
      </div>
    `;
  }

  // Confusion grid
  const confGrid = document.getElementById('me-confusion-grid');
  if (confGrid) {
    confGrid.innerHTML = (p.confusions || []).map(c => `
      <div class="me-sub-card" data-id="${c.id}" data-type="confusion" onclick="openProfileItem('confusion','${c.id}')">
        <div class="me-sub-card-title">${escapeHtml(c.title)}</div>
        <div class="me-sub-card-count">${c.content ? '已记录' : '未记录'}</div>
      </div>
    `).join('') + `
      <div class="me-sub-card add" onclick="addProfileItem('confusion')">
        <div style="font-size:20px;color:var(--accent);">+</div>
        <div class="me-sub-card-title" style="font-size:12px;">新增</div>
      </div>
    `;
    // Long press to delete custom items
    confGrid.querySelectorAll('.me-sub-card:not(.add)').forEach(el => initProfileItemLongPress(el, 'confusion'));
  }

  // Mindset grid
  const mindGrid = document.getElementById('me-mindset-grid');
  if (mindGrid) {
    mindGrid.innerHTML = (p.mindsets || []).map(m => `
      <div class="me-sub-card" data-id="${m.id}" data-type="mindset" onclick="openProfileItem('mindset','${m.id}')">
        <div class="me-sub-card-title">${escapeHtml(m.title)}</div>
        <div class="me-sub-card-count">${m.content ? '已记录' : '未记录'}</div>
      </div>
    `).join('') + `
      <div class="me-sub-card add" onclick="addProfileItem('mindset')">
        <div style="font-size:20px;color:var(--accent);">+</div>
        <div class="me-sub-card-title" style="font-size:12px;">新增</div>
      </div>
    `;
    mindGrid.querySelectorAll('.me-sub-card:not(.add)').forEach(el => initProfileItemLongPress(el, 'mindset'));
  }
}

function openAvatarLightbox() {
  const p = loadProfile();
  if (!p.avatar) return;
  document.getElementById('avatar-lightbox-img').src = p.avatar;
  setView('view-avatar-lightbox');
}
function closeAvatarLightbox() {
  switchTab('me');
}
function changeAvatar() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await compressImage(await readFileAsDataURL(file), 400, 0.8);
    const p = loadProfile();
    p.avatar = dataUrl;
    saveProfile(p);
    renderMePage();
    showToast('头像已更新');
  };
  input.click();
}
function readFileAsDataURL(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.readAsDataURL(file);
  });
}
function openSettings() {
  setView('view-settings');
}

// MBTI
function openMbtiModal() {
  const p = loadProfile();
  document.getElementById('mbti-input').value = p.mbti.type || '';
  document.getElementById('mbti-note').value = p.mbti.note || '';
  document.getElementById('modal-mbti').classList.add('open');
}
function saveMbti() {
  const type = document.getElementById('mbti-input').value.trim().toUpperCase();
  const note = document.getElementById('mbti-note').value.trim();
  const p = loadProfile();
  p.mbti = { type, note };
  saveProfile(p);
  document.getElementById('modal-mbti').classList.remove('open');
  renderMePage();
  showToast('已保存');
}

// Name
function openNameModal() {
  const p = loadProfile();
  document.getElementById('name-input').value = p.name || '';
  document.getElementById('modal-name').classList.add('open');
}
function saveName() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { showToast('名字不能为空'); return; }
  const p = loadProfile();
  p.name = name;
  saveProfile(p);
  document.getElementById('modal-name').classList.remove('open');
  renderMePage();
  showToast('已保存');
}

// Profile items (confusion / mindset)
let editingProfileType = '';
let editingProfileId = '';
function openProfileItem(type, id) {
  const p = loadProfile();
  const arr = type === 'confusion' ? p.confusions : p.mindsets;
  const item = arr.find(x => x.id === id);
  if (!item) return;
  editingProfileType = type;
  editingProfileId = id;
  document.getElementById('profile-item-modal-title').textContent = type === 'confusion' ? '🧠 心理困惑' : '🔍 待探究';
  document.getElementById('profile-item-title').value = item.title;
  document.getElementById('profile-item-content').value = item.content;
  document.getElementById('modal-profile-item').classList.add('open');
}
function saveProfileItem() {
  const title = document.getElementById('profile-item-title').value.trim();
  const content = document.getElementById('profile-item-content').value.trim();
  if (!title) { showToast('标题不能为空'); return; }
  const p = loadProfile();
  const arr = editingProfileType === 'confusion' ? p.confusions : p.mindsets;
  const item = arr.find(x => x.id === editingProfileId);
  if (item) {
    item.title = title;
    item.content = content;
  }
  saveProfile(p);
  document.getElementById('modal-profile-item').classList.remove('open');
  renderMePage();
  showToast('已保存');
}
function addProfileItem(type) {
  const title = prompt(type === 'confusion' ? '输入困惑名称：' : '输入待探究概念名称：');
  if (!title || !title.trim()) return;
  const p = loadProfile();
  const arr = type === 'confusion' ? p.confusions : p.mindsets;
  arr.push({
    id: (type === 'confusion' ? 'conf_' : 'mind_') + Date.now(),
    title: title.trim(),
    content: ''
  });
  saveProfile(p);
  renderMePage();
}
function initProfileItemLongPress(el, type) {
  // Only allow deleting custom items (non-default)
  const id = el.dataset.id;
  const prefix = type === 'confusion' ? 'conf_' : 'mind_';
  if (!id.startsWith(prefix) || parseInt(id.split('_')[1]) < 100) return; // default items have small numbers

  let lpTimer = null;
  function startLP(e) {
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (confirm('删除「' + el.querySelector('.me-sub-card-title').textContent + '」？')) {
        const p = loadProfile();
        const arr = type === 'confusion' ? p.confusions : p.mindsets;
        const idx = arr.findIndex(x => x.id === id);
        if (idx > -1) { arr.splice(idx, 1); saveProfile(p); renderMePage(); showToast('已删除'); }
      }
    }, 600);
  }
  function endLP() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
  el.addEventListener('touchstart', startLP, {passive: true});
  el.addEventListener('touchend', endLP);
  el.addEventListener('touchcancel', endLP);
  el.addEventListener('mousedown', startLP);
  el.addEventListener('mouseup', endLP);
  el.addEventListener('mouseleave', endLP);
}

/* ======================== NAVIGATION ======================== */
async function goHome() {
  if (cloudAvailable) {
    try {
      const tasks = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,
          'task_id=eq.' + t.id + '&order=created_at.asc');
        t.records = records || [];
      }
      tasksCache = tasks;
      saveToLocal();
    } catch(e) { /* keep current cache */ }
  }
  renderHome();
  switchTab('record');
}

function goDetail() {
  const task = getTaskFromCache(currentTaskId);
  if (task) renderRecords(task);
  setView('view-detail');
}

/* ======================== LIGHTBOX ======================== */
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

/* ======================== ESCAPE HTML ======================== */
function escapeHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ======================== KEYBOARD ======================== */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') {
    const active = document.querySelector('.view.active');
    if (active && active.id === 'view-detail') submitRecord();
  }
  if (e.key === 'Escape') {
    closeLightbox();
    closeNewTaskModal();
  }
});

/* ======================== INIT ======================== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => {
    console.log('Service Worker registered');
  }).catch(err => {
    console.log('SW registration failed:', err);
  });
}

(async function init() {
  // Show welcome modal every time with rotating quote
  document.getElementById('welcome-quote').textContent = getNextQuote();
  document.getElementById('welcome-overlay').style.display = 'flex';

  // Init mood sun button
  initSunButton();

  // First load local data immediately (no loading screen!)
  const localData = loadLocalData();
  tasksCache = localData.tasks || [];
  renderHome();
  updateSyncBadge('local');

  // Then try cloud in background
  try {
    cloudAvailable = await testCloudConnection();
    if (cloudAvailable) {
      const tasks = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
      for (const t of tasks) {
        const records = await apiFetch('records', 'GET', null,
          'task_id=eq.' + t.id + '&order=created_at.asc');
        t.records = records || [];
      }
      tasksCache = tasks;
      saveToLocal();
      renderHome();
      updateSyncBadge('cloud');

      if (localData.tasks && localData.tasks.length > 0 && tasks.length === 0) {
        await syncLocalToCloud();
        const reloaded = await apiFetch('tasks', 'GET', null, 'select=*&order=created_at.asc');
        for (const t of reloaded) {
          const recs = await apiFetch('records', 'GET', null,
            'task_id=eq.' + t.id + '&order=created_at.asc');
          t.records = recs || [];
        }
        tasksCache = reloaded;
        saveToLocal();
        renderHome();
      }
    }
  } catch(e) {
    console.log('Cloud unavailable, using local only');
  }
})();
</script>
